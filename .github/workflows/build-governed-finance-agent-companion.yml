name: Build governed finance-agent companion PDF

on:
  push:
    branches:
      - post/governed-finance-agent-operating-model-companion
    paths:
      - .github/workflows/build-governed-finance-agent-companion.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install presentation tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
          python -m pip install --disable-pip-version-check python-pptx
      - name: Build detailed presentation and PDF derivative
        run: |
          mkdir -p build posts/governed-finance-agent-operating-model
          python - <<'PY'
          from pptx import Presentation
          from pptx.util import Inches, Pt
          from pptx.enum.text import PP_ALIGN, MSO_ANCHOR
          from pptx.enum.shapes import MSO_SHAPE
          from pptx.dml.color import RGBColor
          from pathlib import Path

          OUT = Path('build/governed-finance-agent-operating-model-companion.v0.1.pptx')
          G=RGBColor(0x1C,0x1C,0x1A); C=RGBColor(0x2A,0x2A,0x27); S=RGBColor(0x57,0x57,0x51)
          I=RGBColor(0xF7,0xF2,0xE8); W=RGBColor(0xFF,0xFF,0xFF); D=RGBColor(0xDD,0xD4,0xC7); A=RGBColor(0xC4,0x6F,0x3B)
          prs=Presentation(); prs.slide_width=Inches(13.333333); prs.slide_height=Inches(7.5)
          prs.core_properties.title='The Missing Infrastructure for Finance Agents — Detailed Companion'
          prs.core_properties.author='Delyan Dosev'; prs.core_properties.company='Dosev AI'
          prs.core_properties.subject='Public-safe conceptual architecture companion'

          def box(slide,x,y,w,h,fill,line=D,r=.08):
              sh=slide.shapes.add_shape(MSO_SHAPE.ROUNDED_RECTANGLE,Inches(x),Inches(y),Inches(w),Inches(h))
              sh.fill.solid(); sh.fill.fore_color.rgb=fill; sh.line.color.rgb=line; sh.line.width=Pt(1)
              return sh
          def text(slide,txt,x,y,w,h,size=18,color=G,bold=False,align=PP_ALIGN.LEFT,font='Aptos',valign=MSO_ANCHOR.TOP):
              tb=slide.shapes.add_textbox(Inches(x),Inches(y),Inches(w),Inches(h)); tf=tb.text_frame; tf.clear(); tf.word_wrap=True; tf.margin_left=tf.margin_right=Inches(.03); tf.margin_top=tf.margin_bottom=Inches(.02); tf.vertical_anchor=valign
              p=tf.paragraphs[0]; p.alignment=align; p.text=txt
              for run in p.runs: run.font.name=font; run.font.size=Pt(size); run.font.bold=bold; run.font.color.rgb=color
              return tb
          def base(dark=False):
              s=prs.slides.add_slide(prs.slide_layouts[6]); s.background.fill.solid(); s.background.fill.fore_color.rgb=G if dark else I
              # Gate Path symbol approximation
              sh=s.shapes.add_shape(MSO_SHAPE.ARC,Inches(.48),Inches(.24),Inches(.38),Inches(.38)); sh.fill.background(); sh.line.color.rgb=I if dark else G; sh.line.width=Pt(4)
              text(s,'Dosev AI',.92,.29,1.15,.24,11,I if dark else G,True,font='Aptos Display')
              text(s,'Governed AI. Practical proof.',.92,.53,2.35,.18,7.5,D if dark else S)
              ln=s.shapes.add_shape(MSO_SHAPE.RECTANGLE,Inches(.5),Inches(7.04),Inches(12.35),Inches(.012)); ln.fill.solid(); ln.fill.fore_color.rgb=C if dark else D; ln.line.fill.background()
              text(s,'Dosev AI · finance-agent operating model · public companion',.5,7.1,5.8,.16,7,D if dark else S)
              text(s,str(len(prs.slides)),12.35,7.09,.45,.17,7,D if dark else S,align=PP_ALIGN.RIGHT)
              return s
          def title_slide(kicker,title,sub,meta):
              s=base(True); text(s,kicker,.7,1.45,8,.3,12,A,True); text(s,title,.7,2,11.3,1.45,34,I,True,font='Aptos Display'); text(s,sub,.72,3.72,10.7,1,18,D); ln=s.shapes.add_shape(MSO_SHAPE.RECTANGLE,Inches(.72),Inches(5.08),Inches(2.35),Inches(.04)); ln.fill.solid(); ln.fill.fore_color.rgb=A; ln.line.fill.background(); text(s,meta,.72,5.42,9,.35,11,D)
          def section(num,title,note):
              s=base(True); text(s,num,.76,1.42,1.4,.6,24,A,True,font='Aptos Display'); text(s,title,.76,2.1,10.8,1.5,32,I,True,font='Aptos Display'); text(s,note,.78,4.15,10,.9,16,D)
          def two(title,lh,lb,rh,rb):
              s=base(); text(s,title,.68,1.1,11.6,.72,27,G,True,font='Aptos Display'); text(s,lh,.75,2.25,5.45,.42,13,A,True); text(s,lb,.75,2.84,5.45,3.05,15,G); text(s,rh,7.12,2.25,5.45,.42,13,A,True); text(s,rb,7.12,2.84,5.45,3.05,15,G); ln=s.shapes.add_shape(MSO_SHAPE.RECTANGLE,Inches(6.64),Inches(2.2),Inches(.012),Inches(3.85)); ln.fill.solid(); ln.fill.fore_color.rgb=D; ln.line.fill.background()
          def body(title,content):
              s=base(); text(s,title,.68,1.1,11.6,.72,27,G,True,font='Aptos Display'); text(s,content,.72,2.12,11.45,3.95,17,G)
          def statement(q,attr,note):
              s=base(True); text(s,q,1.05,1.55,11.15,2.45,30,I,True,PP_ALIGN.CENTER,'Aptos Display',MSO_ANCHOR.MIDDLE); text(s,attr,2,4.35,9.25,.45,13,A,True,PP_ALIGN.CENTER); text(s,note,2,5.05,9.25,.6,11.5,D,False,PP_ALIGN.CENTER)
          def flow(title,labels,caption,gate=-1):
              s=base(); text(s,title,.68,1.1,11.6,.72,27,G,True,font='Aptos Display'); box(s,.72,2.02,11.9,3.72,W)
              x0=.9; total=11.55; gap=.1; bw=(total-gap*(len(labels)-1))/len(labels)
              for i,label in enumerate(labels):
                  x=x0+i*(bw+gap); fg=W if i==gate else G; fill=A if i==gate else W; box(s,x,2.68,bw,.94,fill,A if i==gate else D); text(s,label,x+.04,2.86,bw-.08,.5,10.2,fg,i==gate,PP_ALIGN.CENTER,'Aptos',MSO_ANCHOR.MIDDLE)
              text(s,caption,1,4.35,11.3,.75,17,G,True,PP_ALIGN.CENTER,'Aptos Display')
          def roles(title,items):
              s=base(); text(s,title,.68,1.1,11.6,.72,27,G,True,font='Aptos Display'); box(s,.72,2.02,11.9,3.72,W)
              for i,(name,desc,accent) in enumerate(items):
                  col=i%4; row=i//4; x=.92+col*2.98; y=2.3+row*1.08; fill=A if accent else W; box(s,x,y,2.75,.78,fill,A if accent else D); text(s,name,x+.08,y+.11,2.59,.23,11.5,W if accent else G,True,PP_ALIGN.CENTER,'Aptos Display'); text(s,desc,x+.08,y+.42,2.59,.2,8.5,I if accent else S,False,PP_ALIGN.CENTER)
          def closing(title,content):
              s=base(True); text(s,title,.78,1.72,10.9,1.35,32,I,True,font='Aptos Display'); text(s,content,.82,3.36,10.7,1.45,16.5,D); text(s,'dosevai.com · Governed AI. Practical proof.',.82,5.36,10.6,.5,12.5,A,True)

          title_slide('DETAILED COMPANION · PUBLIC-SAFE CONTENT','The Missing Infrastructure for Finance Agents','A governed finance operating model from regulation to ledger','Dosev AI · July 2026 · conceptual architecture')
          section('01','The problem is not only posting. It is reconstructing why.','The ledger records the outcome; authority, reasoning, calculation, review, and evidence are often fragmented elsewhere.')
          two('Finance repeatedly rebuilds the decision trail','WHAT THE LEDGER RETAINS','Entity\nAccount\nAmount\nCurrency\nDate\nDocument\nApprover','WHAT IS OFTEN FRAGMENTED','Effective authority\nApproved interpretation\nCalculation version\nEvidence set\nPreparer and reviewer logic\nException rationale\nChange impact')
          statement('The strongest business case is reducing repeated interpretation, calculation rebuilding, and evidence reconstruction.','Operating-model thesis','Faster posting may follow, but transparency and reproducibility are the primary control outcomes.')
          two('The enabling components already exist','STRUCTURE AND AUTHORITY','IFRS digital taxonomies\nXBRL Global Ledger\nISO audit-data standards\nElectronic invoicing and tax reporting\nRules as Code\nPolicy as code','EXECUTION AND ORGANIZATION','ERP agent interfaces\nMCP and APIs\nSpecialist agents\nSupervisors and reviewers\nDeterministic calculation tools\nVersioned delivery controls')
          flow('The missing layer is a regulation-to-ledger control plane',['External authority','Corporate policy','Deterministic rules','Role-bounded agents','Independent review','Controlled execution','Provenance'],'Each layer is independently owned, versioned, and reviewable.',5)
          body('Layer 1 · External authority registry','Record the issuing authority, jurisdiction, source provision, effective and transition dates, official and superseded versions, stable source reference, and integrity fingerprint.\n\nWhere no machine-consumable official package exists, normalization must preserve the boundary between official text and derived interpretation.')
          body('Layer 2 · Governed corporate policy and knowledge','The operational knowledge layer includes accounting and tax policies, chart-of-accounts guidance, delegation, materiality, evidence requirements, procedures, controls, exception criteria, and reviewer roles.\n\nThe lifecycle is explicit: draft → reviewed → approved → effective → superseded or withdrawn. Agents consume only the projection approved for their role, entity, jurisdiction, and case date.')
          body('Layer 3 · Tested deterministic rules and calculations','Each recurring calculation has a stable identifier, semantic version, input and output schema, implementation, positive and negative tests, boundary tests, approved tolerances, effective dates, governing-policy reference, and release evidence.\n\nThe language model orchestrates and explains. It does not improvise material arithmetic when an approved calculation exists.')
          body('Layer 4 · Agent roles are authority contracts','A role contract defines permitted knowledge, allowed tools and ERP actions, entity and transaction scope, preparation and review rights, materiality thresholds, mandatory evidence, second-line review, escalation and stop conditions, model-routing policy, and provenance requirements.')
          body('Layer 5 · The ERP remains the transactional system of record','MCP, agent interfaces, or APIs provide the execution channel. The control plane decides when the connector may be invoked and what evidence must exist before a proposal, approval, or posting action is permitted.\n\nRicher provenance can live in ERP extension fields, a subledger, an immutable sidecar, or an event-driven control service.')
          section('02','Translate finance responsibilities into bounded agent roles.','One governed knowledge constitution supports different role projections, permissions, review mandates, and execution rights.')
          roles('A possible role-bounded finance organization',[('Accounting','classification and journals',False),('Tax','tax treatment and evidence',False),('Fixed assets','capitalization and depreciation',False),('Intercompany','matching and adjustments',False),('Consolidation','group adjustments',False),('Treasury','payments and liquidity',False),('FP&A','forecast and scenarios',False),('Chief accountant','independent treatment review',True),('Controller','materiality and period',False),('Control','permissions and thresholds',False),('Internal audit','evidence and policy replay',False),('Human owner','accountable authorization',True)])
          flow('Segregation of duties must be machine-enforceable',['Accounting prepares','Tax validates','Chief accountant reviews','Control checks','Human authorizes','Connector posts','Audit replays'],'No single agent selects policy, calculates, approves, posts, and certifies its own work.',4)
          two('Route reasoning and review effort to the cases that justify it','STANDARD AND MODERATE','Standard: deterministic rules, bounded model, automated checks, exception-only human review.\n\nModerate: stronger reasoning, role-specific tools, independent second-agent review, controller approval above thresholds.','HIGH JUDGMENT','Impairment, provisions, revenue recognition, restructuring, and uncertain tax positions.\n\nRequire the strongest approved model, multiple specialist perspectives, disagreement analysis, technical review, and mandatory human authorization.')
          two('Different models can help, but diversity is not independence','WEAK REVIEW','Same source package\nSame calculation result\nReviewer sees preparer conclusion first\nShared permissions\nAgreement treated as proof','STRUCTURAL REVIEW','Separate mandate\nIndependent source retrieval\nCalculation reproduction\nExplicit challenge questions\nDisagreement thresholds\nMandatory escalation')
          section('03','Follow one supplier invoice across procurement, tax, accounting, treasury, review, and audit.','A prepaid service, foreign currency, and recoverable VAT expose the cross-process handoffs.')
          flow('An end-to-end operating process, not disconnected chatbots',['P2P validation','Tax treatment','Accounting + allocation','Treasury check','Independent review','Human approval','Posting','Audit replay'],'Each stage contributes a distinct decision and evidence record.',5)
          body('A transaction can retain its accounting provenance','Authority version · corporate policy version · calculation package · preparer role and skill · reviewer role and result · input and result hashes · decision classification · exception state · human authorization.\n\nRoutine transactions carry a compact envelope. Complex cases retain richer judgment and evidence. The objective is stable pointers and integrity, not embedding every source document in the ledger.')
          two('Versioned lineage changes how finance handles change and assurance','POLICY CHANGE','Detect new source version\nAssess impact\nUpdate interpretation\nChange and test calculation\nReview and activate\nIdentify affected population\nReplay original inputs','AUDIT REPLAY','Transaction → effective authority\nTransaction → policy and calculation\nTransaction → preparer and reviewer\nPolicy version → complete population\nPopulation → exceptions, missing evidence, disagreements')
          section('04','Prove the governance pattern before building a new platform.','A private repository can govern one synthetic package through versioned files, tests, review, and immutable commit identity.')
          flow('GitHub as a minimum viable control plane',['Policy change','Branch','Pull request','Tests','CODEOWNERS review','Protected merge','Approved commit','Runtime read'],'Authoring agent: propose, no merge · Runtime agent: read approved · Audit agent: inspect, no post',4)
          two('A useful first proof is deliberately small','PROVE','One synthetic prepaid invoice\nVersioned accounting policy\nTax interpretation\nTested allocation calculation\nAccounting and tax skills\nIndependent review checklist\nExpected journal payload\nExact commit and test evidence','DO NOT CLAIM','Live ERP posting\nRegulatory sufficiency\nEnterprise retention compliance\nFine-grained production authorization\nHigh-volume transaction service\nAutomatic accounting segregation\nCorrectness from commit identity alone')
          two('Separate today’s bounded test from the larger ecosystem','IMPLEMENTABLE NOW','One process\nApproved policy registry\nDeterministic rule package\nPreparer + reviewer roles\nProposed journal only\nProvenance sidecar\nController or auditor reproduction test','VISIONARY EXTENSION','Machine-readable official rules\nControlled interpretation packages\nEnterprise role and identity services\nStandardized governed ERP actions\nPortable transaction provenance\nContinuous population analysis')
          body('What this architecture does not promise','No autonomous AI accountant. No removal of professional judgment or management accountability. No assumption that every legal rule is safely executable. No use of model agreement as proof. No LLM as the final calculation engine or approver. No claim that metadata alone creates compliance.\n\nThe controls, tests, permissions, evidence, and human authorization must be real.')
          closing('The missing infrastructure answers one controlled question.','What approved authority, role, logic, review, and evidence allowed this transaction to happen?\n\nFinance agents become credible when that answer is explicit, versioned, reproducible, and governed.')
          prs.save(OUT)
          PY
          libreoffice --headless --convert-to pdf --outdir posts/governed-finance-agent-operating-model build/governed-finance-agent-operating-model-companion.v0.1.pptx
          test -s posts/governed-finance-agent-operating-model/governed-finance-agent-operating-model-companion.v0.1.pdf
      - name: Create semantic manifest and validate public boundary
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('posts/governed-finance-agent-operating-model/governed-finance-agent-operating-model-companion.v0.1.pdf')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          m=p.with_suffix('.manifest.yaml')
          m.write_text(f'''schema_version: 1
asset_id: governed-finance-agent-operating-model-companion-v0.1
title: The Missing Infrastructure for Finance Agents
subtitle: A governed finance operating model from regulation to ledger
asset_type: public-safe-pdf-companion
source_format: governed-private-presentation
pages: 26
sha256: {sha}
license: CC0-1.0
alt_text: >-
  A 26-page Dosev AI presentation explaining a proposed regulation-to-ledger control plane,
  role-bounded finance agents, segregation of duties, transaction provenance, and a bounded
  GitHub proof-of-concept path.
caption: >-
  Public-safe companion to the dosevai.com article on the infrastructure required for governed finance agents.
semantic_description: >-
  The document presents a conceptual architecture connecting external authority, approved company policy,
  deterministic calculations, specialist and reviewer agents, controlled ERP execution, human authorization,
  and transaction-level evidence.
claims:
  - The document is a conceptual synthesis using existing standards and agent patterns.
  - A bounded proof of method can start with synthetic cases and repository-based governance.
boundaries:
  - Not evidence of a deployed enterprise accounting platform.
  - Not a claim of autonomous accounting, guaranteed compliance, audit acceptance, or cost savings.
  - Contains no employer, supplier, client, private-repository, credential, or internal-governance information.
  - The public PDF contains no speaker notes.
creation_method: GitHub Actions generated a public-safe presentation and exported it through LibreOffice.
public_safety_state: reviewed-public-safe
''',encoding='utf-8')
          data=p.read_bytes()
          for marker in [b'action-',b'fact-',b'project-',b'cortex://',b'collection://']:
              if marker in data: raise SystemExit(f'private identifier marker found: {marker!r}')
          print(sha)
          PY
      - name: Commit generated public asset and remove transient workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/build-governed-finance-agent-companion.yml
          git add posts/governed-finance-agent-operating-model
          git commit -m 'assets: add governed finance-agent companion PDF [generated asset]'
          git push origin HEAD:${GITHUB_REF_NAME}
