name: Materialize portable harness workbooks
on:
  push:
    branches: [feat/portable-ai-harness-artifacts]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install openpyxl==3.1.5
      - run: python scripts/build_portable_ai_harness.py --root artifacts/portable-ai-harness
      - run: python scripts/validate_public_workbook_artifacts.py --root artifacts --format text
      - name: Update manifest hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('artifacts/portable-ai-harness/manifest.json')
          d=json.loads(p.read_text())
          for item in d['versions']:
              v=item['version']; f=Path(f'artifacts/portable-ai-harness/v{v}/portable-ai-harness-v{v}.xlsx')
              item['files']['workbook']['sha256']=hashlib.sha256(f.read_bytes()).hexdigest()
              s=Path(f'artifacts/portable-ai-harness/v{v}/portable-ai-harness-v{v}-scan.json')
              item['files']['structural_scan']['sha256']=hashlib.sha256(s.read_bytes()).hexdigest()
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Commit verified workbooks and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/portable-ai-harness
          git rm .github/workflows/materialize-portable-harness.yml
          git commit -m 'build: materialize portable harness workbooks [materialized]'
          git push
