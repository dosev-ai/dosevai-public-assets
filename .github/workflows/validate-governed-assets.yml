name: Validate governed assets

on:
  pull_request:
    paths:
      - '.gitignore'
      - 'posts/**'
      - 'fixtures/**'
      - 'artifacts/**'
      - 'scripts/asset_manifest*.py'
      - 'scripts/validate_changed_asset_manifests.py'
      - 'scripts/validate_public_workbook_artifacts.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-governed-assets.yml'
  push:
    branches: [main]
    paths:
      - '.gitignore'
      - 'posts/**'
      - 'fixtures/**'
      - 'artifacts/**'
      - 'scripts/asset_manifest*.py'
      - 'scripts/validate_changed_asset_manifests.py'
      - 'scripts/validate_public_workbook_artifacts.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-governed-assets.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked Python build artifacts
        run: |
          tracked="$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.py[cod]$)' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Tracked Python build artifacts are forbidden"
            printf '%s\n' "$tracked"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - name: Audit production asset packages
        run: >-
          python scripts/asset_manifest.py audit
          --root .
          --expected-repository dosev-ai/dosevai-public-assets
          --format text
      - name: Validate public workbook artifacts
        run: >-
          python scripts/validate_public_workbook_artifacts.py
          --root artifacts
          --format text
      - name: Validate changed asset packages
        run: >-
          python scripts/validate_changed_asset_manifests.py
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
