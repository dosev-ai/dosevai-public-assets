name: Validate governed assets

on:
  pull_request:
    paths:
      - 'posts/**'
      - 'fixtures/**'
      - 'scripts/asset_manifest*.py'
      - 'scripts/validate_changed_asset_manifests.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-governed-assets.yml'
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'fixtures/**'
      - 'scripts/asset_manifest*.py'
      - 'scripts/validate_changed_asset_manifests.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/validate-governed-assets.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - name: Audit production asset packages
        run: >-
          python scripts/asset_manifest.py audit
          --root .
          --format text
          --allow-findings
      - name: Validate changed asset packages
        run: >-
          python scripts/validate_changed_asset_manifests.py
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
