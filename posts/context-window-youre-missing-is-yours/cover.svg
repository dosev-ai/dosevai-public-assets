<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Context Window You're Missing Is Yours</title>
  <desc id="desc">Editorial illustration of a persistent human working context across phone and desktop. Several project groups remain visible on the phone. One active project is expanded on desktop into separate orchestrator and delivery lanes, showing that related work can stay together while model sessions, roles, and authorization boundaries remain distinct.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9fbff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b64e8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#20304a" flood-opacity="0.14"/></filter>
    <style>
      .h1{font:700 56px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f1b33;letter-spacing:-1px}.lead{font:400 25px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#44516a}.eyebrow{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5b64e8;letter-spacing:3px}.label{font:700 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17243d}.small{font:500 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#58657c}.tiny{font:600 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#617089}.lane{font:700 19px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#182844}.meta{font:600 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6c7890}.card{fill:#fff;stroke:#d7deeb;stroke-width:1.5}.chip{font:700 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#44516a}.section{font:700 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#627087}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <text class="eyebrow" x="88" y="120">FOCUS BY DESIGN</text>
  <text class="h1" x="88" y="195"><tspan x="88">The Context</tspan><tspan x="88" dy="66">Window You're</tspan><tspan x="88" dy="66">Missing Is Yours</tspan></text>
  <text class="lead" x="88" y="420"><tspan x="88">Persistent working sets across devices.</tspan><tspan x="88" dy="38">Bounded lanes inside one active project.</tspan><tspan x="88" dy="38">Recoverable focus, fewer open threads.</tspan></text>

  <g transform="translate(88 585)">
    <rect x="0" y="0" width="235" height="58" rx="29" fill="#ffffff" stroke="#d9e0ec"/>
    <circle cx="31" cy="29" r="11" fill="#5b64e8"/><text class="small" x="52" y="35">Room persists</text>
    <rect x="252" y="0" width="235" height="58" rx="29" fill="#ffffff" stroke="#d9e0ec"/>
    <circle cx="283" cy="29" r="11" fill="#16a36d"/><text class="small" x="304" y="35">Lanes stay separate</text>
    <rect x="0" y="76" width="487" height="58" rx="29" fill="#ffffff" stroke="#d9e0ec"/>
    <circle cx="31" cy="105" r="11" fill="#ed8b2c"/><text class="small" x="52" y="111">Durable project state makes re-entry possible</text>
  </g>
  <text class="small" x="88" y="795">The browser does not create the permissions. It makes the working boundaries visible.</text>

  <g filter="url(#shadow)">
    <rect x="670" y="95" width="835" height="625" rx="28" fill="#ffffff" stroke="#ccd6e5" stroke-width="2"/>
    <rect x="670" y="95" width="835" height="70" rx="28" fill="#14233f"/>
    <rect x="670" y="137" width="835" height="28" fill="#14233f"/>
    <circle cx="705" cy="130" r="8" fill="#ff7b73"/><circle cx="731" cy="130" r="8" fill="#f8bd4f"/><circle cx="757" cy="130" r="8" fill="#4dc36f"/>
    <text x="795" y="138" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#fff">Work — active context</text>

    <rect x="690" y="185" width="165" height="515" rx="18" fill="#f5f7fb"/>
    <text class="section" x="714" y="220">PERSISTENT GROUPS</text>
    <g transform="translate(710 242)">
      <rect width="125" height="42" rx="12" fill="#e7eafe"/><circle cx="20" cy="21" r="7" fill="#5b64e8"/><text class="small" x="38" y="27">Work</text>
      <rect y="52" width="125" height="42" rx="12" fill="#fff"/><circle cx="20" cy="73" r="7" fill="#3b82f6"/><text class="small" x="38" y="79">Dosevai</text>
      <rect y="104" width="125" height="42" rx="12" fill="#fff"/><circle cx="20" cy="125" r="7" fill="#18a26b"/><text class="small" x="38" y="131">Skills</text>
      <rect y="156" width="125" height="42" rx="12" fill="#fff"/><circle cx="20" cy="177" r="7" fill="#ed8b2c"/><text class="small" x="38" y="183">Copilot</text>
      <rect y="208" width="125" height="42" rx="12" fill="#fff"/><circle cx="20" cy="229" r="7" fill="#e25454"/><text class="small" x="38" y="235">Stock</text>
      <rect y="260" width="125" height="42" rx="12" fill="#fff"/><circle cx="20" cy="281" r="7" fill="#9b5de5"/><text class="small" x="38" y="287">Family</text>
      <rect y="312" width="125" height="42" rx="12" fill="#fff"/><circle cx="20" cy="333" r="7" fill="#17a6b7"/><text class="small" x="38" y="339">Research</text>
    </g>

    <text class="section" x="890" y="215">ONE PROJECT • TWO BOUNDED LANES</text>
    <rect x="890" y="240" width="280" height="400" rx="20" class="card" stroke="#6f76e8"/>
    <rect x="1188" y="240" width="280" height="400" rx="20" class="card" stroke="#19a36d"/>

    <circle cx="922" cy="278" r="12" fill="#5b64e8"/><text class="lane" x="946" y="285">Orchestrator / PM</text>
    <text class="meta" x="914" y="314">Broad objective • scope • blockers</text>
    <line x1="914" y1="337" x2="1145" y2="337" stroke="#e1e7f0"/>
    <text class="section" x="914" y="370">SESSION / MODEL CONTEXT</text>
    <rect x="914" y="390" width="205" height="13" rx="6" fill="#dce2ef"/><rect x="914" y="414" width="170" height="13" rx="6" fill="#e6eaf2"/><rect x="914" y="438" width="190" height="13" rx="6" fill="#e6eaf2"/>
    <text class="section" x="914" y="485">AUTHORIZATION BOUNDARY</text>
    <rect x="914" y="505" width="210" height="38" rx="12" fill="#eef0ff"/><text class="chip" x="930" y="529">plan • coordinate • request</text>
    <text class="section" x="914" y="578">NEXT HUMAN QUESTION</text><text class="small" x="914" y="607">What should move next?</text>

    <circle cx="1220" cy="278" r="12" fill="#16a36d"/><text class="lane" x="1244" y="285">Delivery / Execution</text>
    <text class="meta" x="1212" y="314">Narrow task • evidence • build</text>
    <line x1="1212" y1="337" x2="1443" y2="337" stroke="#e1e7f0"/>
    <text class="section" x="1212" y="370">SESSION / MODEL CONTEXT</text>
    <rect x="1212" y="390" width="205" height="13" rx="6" fill="#dce2ef"/><rect x="1212" y="414" width="160" height="13" rx="6" fill="#e6eaf2"/><rect x="1212" y="438" width="185" height="13" rx="6" fill="#e6eaf2"/>
    <text class="section" x="1212" y="485">AUTHORIZATION BOUNDARY</text>
    <rect x="1212" y="505" width="210" height="38" rx="12" fill="#e9f8f2"/><text class="chip" x="1228" y="529">execute • validate • report</text>
    <text class="section" x="1212" y="578">NEXT HUMAN QUESTION</text><text class="small" x="1212" y="607">Does this need approval?</text>

    <rect x="890" y="660" width="578" height="38" rx="12" fill="#f7f8fb" stroke="#dce2eb"/><text class="small" x="1179" y="685" text-anchor="middle">Keep related work together. Keep role, scope, and authority explicit.</text>
  </g>

  <g transform="translate(1330 585)" filter="url(#shadow)">
    <rect x="0" y="0" width="235" height="300" rx="34" fill="#17243d"/>
    <rect x="12" y="16" width="211" height="268" rx="25" fill="#f9fafc"/>
    <rect x="80" y="8" width="76" height="15" rx="7" fill="#0f1b33"/>
    <text class="section" x="30" y="58">WORKING CONTEXTS</text>
    <g transform="translate(28 76)">
      <rect width="82" height="64" rx="14" fill="#ebeefe" stroke="#7b80ea"/><circle cx="17" cy="18" r="6" fill="#5b64e8"/><text class="tiny" x="30" y="23">Work</text><rect x="12" y="37" width="23" height="8" rx="4" fill="#a7adf4"/><rect x="42" y="37" width="25" height="8" rx="4" fill="#c3c7f7"/>
      <rect x="94" width="82" height="64" rx="14" fill="#eef6ff" stroke="#78aaf0"/><circle cx="111" cy="18" r="6" fill="#3b82f6"/><text class="tiny" x="124" y="23">Dosevai</text><rect x="106" y="37" width="23" height="8" rx="4" fill="#9cc2f5"/><rect x="136" y="37" width="25" height="8" rx="4" fill="#c3dcfa"/>
      <rect y="76" width="82" height="64" rx="14" fill="#edf9f4" stroke="#72c9a3"/><circle cx="17" cy="94" r="6" fill="#18a26b"/><text class="tiny" x="30" y="99">Skills</text><rect x="12" y="113" width="23" height="8" rx="4" fill="#8fd6b8"/><rect x="42" y="113" width="25" height="8" rx="4" fill="#bce8d4"/>
      <rect x="94" y="76" width="82" height="64" rx="14" fill="#fff5e9" stroke="#e8af6a"/><circle cx="111" cy="94" r="6" fill="#ed8b2c"/><text class="tiny" x="124" y="99">Copilot</text><rect x="106" y="113" width="23" height="8" rx="4" fill="#efb77c"/><rect x="136" y="113" width="25" height="8" rx="4" fill="#f4d2ab"/>
      <rect y="152" width="82" height="64" rx="14" fill="#fff0f0" stroke="#e69696"/><circle cx="17" cy="170" r="6" fill="#e25454"/><text class="tiny" x="30" y="175">Stock</text><rect x="12" y="189" width="23" height="8" rx="4" fill="#eca5a5"/><rect x="42" y="189" width="25" height="8" rx="4" fill="#f3c8c8"/>
      <rect x="94" y="152" width="82" height="64" rx="14" fill="#f7effd" stroke="#c49ae7"/><circle cx="111" cy="170" r="6" fill="#9b5de5"/><text class="tiny" x="124" y="175">Family</text><rect x="106" y="189" width="23" height="8" rx="4" fill="#c49ae7"/><rect x="136" y="189" width="25" height="8" rx="4" fill="#dfc8f2"/>
    </g>
  </g>
  <path d="M1330 735 C1230 730 1180 710 1085 690" fill="none" stroke="#5b64e8" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="1085" cy="690" r="6" fill="#5b64e8"/>
  <text class="small" x="1210" y="780" text-anchor="middle">same active room, different device</text>
</svg>