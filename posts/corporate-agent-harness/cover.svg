<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Before Agents Execute: The Corporate Agent Harness</title>
  <desc id="desc">A dark navy executive diagram showing an AI agent contained by identity, authority, policy, validation, approval, evidence and rollback controls before reaching business systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030814"/><stop offset="0.65" stop-color="#08182b"/><stop offset="1" stop-color="#17100b"/></linearGradient>
    <radialGradient id="glow" cx="82%" cy="46%" r="48%"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".22"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#34597a" stroke-width="1" opacity=".16"/></pattern>
    <style>.display{font-family:Arial,Helvetica,sans-serif;font-weight:800}.body{font-family:Arial,Helvetica,sans-serif}.label{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;fill:#eef5fb}.small{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#a9bfd0}.blue{stroke:#75c9ff}.orange{stroke:#ff8a1f}</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#75c9ff"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><rect width="1600" height="900" fill="url(#glow)"/>
  <text x="92" y="115" class="display" font-size="62" fill="#f6f8fb">BEFORE AGENTS EXECUTE</text>
  <text x="94" y="168" class="body" font-size="30" fill="#9fc5df">The corporate harness turns capability into bounded authority</text>

  <g transform="translate(105 265)">
    <rect width="250" height="320" rx="34" fill="#0b2139" stroke="#75c9ff" stroke-width="3"/>
    <circle cx="125" cy="100" r="50" fill="none" stroke="#75c9ff" stroke-width="7"/>
    <path d="M90 106l25 25 52-62" fill="none" stroke="#75c9ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="125" y="202" text-anchor="middle" class="label">AGENT</text>
    <text x="125" y="240" text-anchor="middle" class="small">Plan • analyse</text><text x="125" y="270" text-anchor="middle" class="small">recommend • act</text>
  </g>

  <path d="M380 425H495" fill="none" stroke="#75c9ff" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(520 225)">
    <rect width="550" height="405" rx="38" fill="#07182a" stroke="#ff8a1f" stroke-width="4"/>
    <text x="275" y="58" text-anchor="middle" class="display" font-size="32" fill="#ff9b48">CORPORATE HARNESS</text>
    <g transform="translate(42 95)">
      <rect width="214" height="72" rx="18" fill="#0c2a46" stroke="#75c9ff"/><text x="107" y="34" text-anchor="middle" class="label">IDENTITY</text><text x="107" y="57" text-anchor="middle" class="small">Who is acting?</text>
      <rect x="252" width="214" height="72" rx="18" fill="#0c2a46" stroke="#75c9ff"/><text x="359" y="34" text-anchor="middle" class="label">AUTHORITY</text><text x="359" y="57" text-anchor="middle" class="small">What is allowed?</text>
      <rect y="95" width="214" height="72" rx="18" fill="#0c2a46" stroke="#75c9ff"/><text x="107" y="129" text-anchor="middle" class="label">POLICY</text><text x="107" y="152" text-anchor="middle" class="small">Which rule applies?</text>
      <rect x="252" y="95" width="214" height="72" rx="18" fill="#0c2a46" stroke="#75c9ff"/><text x="359" y="129" text-anchor="middle" class="label">VALIDATION</text><text x="359" y="152" text-anchor="middle" class="small">Did checks pass?</text>
      <rect y="190" width="214" height="72" rx="18" fill="#24170f" stroke="#ff8a1f"/><text x="107" y="224" text-anchor="middle" class="label">APPROVAL</text><text x="107" y="247" text-anchor="middle" class="small">Who decides?</text>
      <rect x="252" y="190" width="214" height="72" rx="18" fill="#24170f" stroke="#ff8a1f"/><text x="359" y="224" text-anchor="middle" class="label">ROLLBACK</text><text x="359" y="247" text-anchor="middle" class="small">Can it be reversed?</text>
    </g>
  </g>

  <path d="M1095 425H1210" fill="none" stroke="#75c9ff" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(1235 265)">
    <rect width="260" height="320" rx="34" fill="#24170f" stroke="#ff8a1f" stroke-width="3"/>
    <path d="M70 95h120M70 135h120M70 175h120" stroke="#ff8a1f" stroke-width="8" stroke-linecap="round"/>
    <rect x="56" y="62" width="148" height="145" rx="18" fill="none" stroke="#ff8a1f" stroke-width="5"/>
    <text x="130" y="246" text-anchor="middle" class="label">BUSINESS</text><text x="130" y="278" text-anchor="middle" class="small">ERP • payments</text><text x="130" y="306" text-anchor="middle" class="small">orders • contracts</text>
  </g>

  <g transform="translate(305 700)">
    <line x1="0" y1="0" x2="990" y2="0" stroke="#365b78" stroke-width="4"/>
    <circle cx="0" cy="0" r="12" fill="#75c9ff"/><circle cx="330" cy="0" r="12" fill="#75c9ff"/><circle cx="660" cy="0" r="12" fill="#ff8a1f"/><circle cx="990" cy="0" r="12" fill="#ff8a1f"/>
    <text x="0" y="48" text-anchor="middle" class="label">ASSIST</text><text x="330" y="48" text-anchor="middle" class="label">RECOMMEND</text><text x="660" y="48" text-anchor="middle" class="label">EXECUTE</text><text x="990" y="48" text-anchor="middle" class="label">OPTIMIZE</text>
    <text x="495" y="95" text-anchor="middle" class="small">More authority requires stronger controls, evidence and independent challenge</text>
  </g>
</svg>