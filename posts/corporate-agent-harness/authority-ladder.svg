<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">The authority ladder</title>
  <desc id="desc">Four levels of agent delegation from Assist to Optimize, showing what the agent does and the progressively stronger control posture required.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061126"/><stop offset="0.58" stop-color="#071932"/><stop offset="1" stop-color="#071226"/></linearGradient>
    <radialGradient id="glow" cx="95%" cy="7%" r="70%"><stop offset="0" stop-color="#145ab8" stop-opacity="0.42"/><stop offset="0.45" stop-color="#0d3f85" stop-opacity="0.13"/><stop offset="1" stop-color="#071226" stop-opacity="0"/></radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fa8ff"/><stop offset="0.42" stop-color="#3ccae1"/><stop offset="0.72" stop-color="#ffd16a"/><stop offset="1" stop-color="#ff9828"/></linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.display{font-family:Arial,Helvetica,sans-serif;font-weight:800;fill:#f7f9ff}.body{font-family:Arial,Helvetica,sans-serif;fill:#f5f7fc}.muted{font-family:Arial,Helvetica,sans-serif;fill:#b9c5dc}.header{font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;letter-spacing:1.4px;fill:#65a8ff}.level{font-family:Arial,Helvetica,sans-serif;font-size:39px;font-weight:800;fill:#f7f9ff}.rowtext{font-family:Arial,Helvetica,sans-serif;font-size:25px;fill:#f7f9ff}.num{font-family:Arial,Helvetica,sans-serif;font-size:42px;font-weight:800;fill:#f7f9ff;text-anchor:middle;dominant-baseline:central}</style>
  </defs>
  <rect width="1672" height="941" fill="url(#bg)"/><rect width="1672" height="941" fill="url(#glow)"/>
  <text x="56" y="94" class="display" font-size="64">The authority ladder</text><text x="57" y="145" class="muted" font-size="29">The word “agent” hides materially different levels of delegation.</text>
  <text x="130" y="229" class="header">LEVEL</text><text x="516" y="229" class="header">WHAT THE AGENT DOES</text><text x="1047" y="229" class="header">REQUIRED CONTROL POSTURE</text>
  <line x1="59" y1="265" x2="59" y2="825" stroke="url(#rail)" stroke-width="7" stroke-linecap="round" filter="url(#softGlow)"/>
  <g><rect x="95" y="247" width="1481" height="136" rx="24" fill="#0d2341" fill-opacity="0.86" stroke="#28548b" stroke-width="2"/><line x1="442" y1="269" x2="442" y2="361" stroke="#2d5c91" stroke-width="2"/><line x1="1008" y1="269" x2="1008" y2="361" stroke="#2d5c91" stroke-width="2"/><circle cx="59" cy="315" r="13" fill="#0d2341" stroke="#5fa8ff" stroke-width="7" filter="url(#softGlow)"/><line x1="73" y1="315" x2="95" y2="315" stroke="#5fa8ff" stroke-width="4"/><circle cx="154" cy="315" r="37" fill="#12294c" stroke="#5d93f4" stroke-width="3"/><text x="154" y="316" class="num">1</text><text x="214" y="328" class="level">Assist</text><circle cx="517" cy="315" r="41" fill="#0b1e38" stroke="#5d93f4" stroke-width="2"/><path d="M499 290h31v36h-31z M505 299h18 M505 308h13 M527 324l10 10 M526 320a9 9 0 1 0 0-18a9 9 0 0 0 0 18" fill="none" stroke="#63a3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="585" y="308" class="rowtext">Retrieves, analyses, summarizes</text><text x="585" y="341" class="rowtext">or prepares material</text><path d="M1078 275c12 11 23 15 35 18v28c0 22-14 36-35 49c-21-13-35-27-35-49v-28c12-3 23-7 35-18z" fill="none" stroke="#63a3ff" stroke-width="3"/><circle cx="1078" cy="306" r="9" fill="none" stroke="#63a3ff" stroke-width="3"/><path d="M1062 335c3-12 29-12 32 0" fill="none" stroke="#63a3ff" stroke-width="3" stroke-linecap="round"/><text x="1145" y="308" class="rowtext">Source access, privacy controls,</text><text x="1145" y="341" class="rowtext">citation and human review</text></g>
  <g><rect x="95" y="400" width="1481" height="136" rx="24" fill="#0d2341" fill-opacity="0.86" stroke="#28548b" stroke-width="2"/><line x1="442" y1="422" x2="442" y2="514" stroke="#2d5c91" stroke-width="2"/><line x1="1008" y1="422" x2="1008" y2="514" stroke="#2d5c91" stroke-width="2"/><circle cx="59" cy="468" r="13" fill="#0d2341" stroke="#48c6df" stroke-width="7" filter="url(#softGlow)"/><line x1="73" y1="468" x2="95" y2="468" stroke="#48c6df" stroke-width="4"/><circle cx="154" cy="468" r="37" fill="#12294c" stroke="#48c6df" stroke-width="3"/><text x="154" y="469" class="num">2</text><text x="214" y="481" class="level">Recommend</text><circle cx="517" cy="468" r="41" fill="#0b1e38" stroke="#48c6df" stroke-width="2"/><path d="M517 441c-13 0-23 10-23 23c0 8 4 15 11 19v11h24v-11c7-4 11-11 11-19c0-13-10-23-23-23z M506 502h22 M513 434v-10 M489 446l-8-8 M545 446l8-8 M486 470h-11 M559 470h-11" fill="none" stroke="#48c6df" stroke-width="3" stroke-linecap="round"/><text x="585" y="451" class="rowtext">Proposes a treatment, price,</text><text x="585" y="484" class="rowtext">supplier decision, contract clause</text><text x="585" y="517" class="rowtext">or action</text><path d="M1078 428c12 11 23 15 35 18v28c0 22-14 36-35 49c-21-13-35-27-35-49v-28c12-3 23-7 35-18z" fill="none" stroke="#48c6df" stroke-width="3"/><path d="M1078 454v35 M1061 459h34 M1067 463l-10 18h20z M1089 463l-10 18h20z M1065 492h26" fill="none" stroke="#48c6df" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1145" y="451" class="rowtext">Evidence, alternatives, uncertainty,</text><text x="1145" y="484" class="rowtext">policy grounding and professional</text><text x="1145" y="517" class="rowtext">approval</text></g>
  <g><rect x="95" y="553" width="1481" height="136" rx="24" fill="#0d2341" fill-opacity="0.86" stroke="#28548b" stroke-width="2"/><line x1="442" y1="575" x2="442" y2="667" stroke="#2d5c91" stroke-width="2"/><line x1="1008" y1="575" x2="1008" y2="667" stroke="#2d5c91" stroke-width="2"/><circle cx="59" cy="621" r="13" fill="#0d2341" stroke="#ffc45f" stroke-width="7" filter="url(#softGlow)"/><line x1="73" y1="621" x2="95" y2="621" stroke="#ffc45f" stroke-width="4"/><circle cx="154" cy="621" r="37" fill="#12294c" stroke="#ffc45f" stroke-width="3"/><text x="154" y="622" class="num">3</text><text x="214" y="634" class="level">Execute</text><circle cx="517" cy="621" r="41" fill="#0b1e38" stroke="#ff9b27" stroke-width="2"/><path d="M517 598a23 23 0 1 0 0 46a23 23 0 0 0 0-46z M517 610a11 11 0 1 0 0 22a11 11 0 0 0 0-22z M517 591v8 M517 644v8 M487 621h8 M539 621h8 M496 600l6 6 M532 636l6 6 M538 600l-6 6 M502 636l-6 6" fill="none" stroke="#ff9b27" stroke-width="3" stroke-linecap="round"/><text x="585" y="604" class="rowtext">Initiates or completes a transaction,</text><text x="585" y="637" class="rowtext">communication, order, journal</text><text x="585" y="670" class="rowtext">or payment step</text><path d="M1078 581c12 11 23 15 35 18v28c0 22-14 36-35 49c-21-13-35-27-35-49v-28c12-3 23-7 35-18z" fill="none" stroke="#ff9b27" stroke-width="3"/><rect x="1066" y="620" width="24" height="23" rx="3" fill="none" stroke="#ff9b27" stroke-width="3"/><path d="M1070 620v-8a8 8 0 0 1 16 0v8 M1078 630v6" fill="none" stroke="#ff9b27" stroke-width="3" stroke-linecap="round"/><text x="1145" y="604" class="rowtext">Machine-enforced permissions,</text><text x="1145" y="637" class="rowtext">segregation of duties, monitoring,</text><text x="1145" y="670" class="rowtext">approval, evidence and reversal</text></g>
  <g><rect x="95" y="706" width="1481" height="136" rx="24" fill="#0d2341" fill-opacity="0.86" stroke="#28548b" stroke-width="2"/><line x1="442" y1="728" x2="442" y2="820" stroke="#2d5c91" stroke-width="2"/><line x1="1008" y1="728" x2="1008" y2="820" stroke="#2d5c91" stroke-width="2"/><circle cx="59" cy="774" r="13" fill="#0d2341" stroke="#ff9828" stroke-width="7" filter="url(#softGlow)"/><line x1="73" y1="774" x2="95" y2="774" stroke="#ff9828" stroke-width="4"/><circle cx="154" cy="774" r="37" fill="#12294c" stroke="#ff9828" stroke-width="3"/><text x="154" y="775" class="num">4</text><text x="214" y="787" class="level">Optimize</text><circle cx="517" cy="774" r="41" fill="#0b1e38" stroke="#ff861c" stroke-width="2"/><path d="M493 796h48 M499 788v-15 M510 788v-27 M521 788v-38 M532 788v-51 M494 762l14-13l12 5l18-21 M531 733h7v7" fill="none" stroke="#ff861c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="585" y="757" class="rowtext">Searches across entities, policies</text><text x="585" y="790" class="rowtext">and processes to improve</text><text x="585" y="823" class="rowtext">an objective</text><path d="M1078 734c12 11 23 15 35 18v28c0 22-14 36-35 49c-21-13-35-27-35-49v-28c12-3 23-7 35-18z" fill="none" stroke="#ff861c" stroke-width="3"/><circle cx="1078" cy="775" r="17" fill="none" stroke="#ff861c" stroke-width="2.5"/><circle cx="1078" cy="775" r="7" fill="none" stroke="#ff861c" stroke-width="2.5"/><path d="M1078 750v10 M1078 790v10 M1053 775h10 M1093 775h10" fill="none" stroke="#ff861c" stroke-width="2.5" stroke-linecap="round"/><text x="1145" y="747" class="rowtext" font-size="23">Strongest governance: objective</text><text x="1145" y="777" class="rowtext" font-size="23">constraints, economic-substance tests,</text><text x="1145" y="807" class="rowtext" font-size="23">independent challenge and</text><text x="1145" y="832" class="rowtext" font-size="22">continuous monitoring</text></g>
</svg>
