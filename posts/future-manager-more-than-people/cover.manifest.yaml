title: The Future Manager Will Manage More Than People
alt: >-
  A manager expands from span of control to span of orchestration, coordinating people, agents, knowledge, tools and workflows within evidence, approval and escalation controls.
caption: >-
  Management scope expands beyond people: functional managers coordinate human and machine capability while evidence, approval and escalation preserve accountability.
semantic_description: >-
  The cover shows five capabilities—People, Agents, Knowledge, Tools and Workflows—connected to a central manager figure. The lower control layer contains Evidence, Approval and Escalation. The composition illustrates the article's span-of-orchestration thesis: managers remain people leaders while becoming accountable for how human judgement, AI agents, approved knowledge, deterministic tools and reusable workflows combine to produce business outcomes. The visual does not imply autonomous approval, reduced human accountability or that every manager must become an AI engineer.
claims:
  - Managers can be accountable for work performed across people, agents, knowledge, tools and workflows.
  - Evidence, approval and escalation remain part of accountable orchestration.
  - Distributed business-side building capability can coexist with central platform guardrails.
boundaries:
  - The visual is an editorial operating-model interpretation, not a forecast of a specific organisation structure.
  - The visual does not identify any employer, vendor, model, private system or proprietary workflow.
  - The visual does not imply automatic approval, unattended execution or reduced human accountability.
  - The visual does not claim that managers replace platform, engineering, security, risk or legal specialists.
