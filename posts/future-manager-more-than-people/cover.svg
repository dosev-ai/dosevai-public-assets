<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Future Manager Will Manage More Than People</title>
  <desc id="desc">Executive cover showing a manager moving from span of control to span of orchestration by coordinating people, agents, knowledge, tools and workflows within evidence, approval and escalation controls.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf5"/>
      <stop offset="0.66" stop-color="#f4f0e7"/>
      <stop offset="1" stop-color="#e8e3d9"/>
    </linearGradient>
    <linearGradient id="navyBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071629"/>
      <stop offset="0.55" stop-color="#0b2139"/>
      <stop offset="1" stop-color="#061326"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f4efe5"/>
    </linearGradient>
    <linearGradient id="managerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17304e"/>
      <stop offset="1" stop-color="#071629"/>
    </linearGradient>
    <style>
      .display{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:.3px}
      .body{font-family:Arial,Helvetica,sans-serif}
      .nodeTitle{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:24px;fill:#0a1b31;text-anchor:middle}
      .nodeSub{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#3d4b5c;text-anchor:middle}
      .controlTitle{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:24px;fill:#d1a65a;text-anchor:middle;letter-spacing:.4px}
      .controlSub{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#f5f1e8;text-anchor:middle}
      .icon{fill:none;stroke:#0a1b31;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .iconGold{fill:none;stroke:#d1a65a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
