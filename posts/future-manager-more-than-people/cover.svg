  <line x1="70" y1="598" x2="1530" y2="598" stroke="#9aabbb" stroke-width="2" opacity="0.22"/>
  <text x="800" y="82" text-anchor="middle" class="display" font-size="66" fill="#06182d">THE FUTURE MANAGER</text>
  <text x="800" y="145" text-anchor="middle" class="display" font-size="48" fill="#b1843c">WILL MANAGE MORE THAN PEOPLE</text>
  <text x="800" y="195" text-anchor="middle" class="body" font-size="29" fill="#24374a">From span of control to span of orchestration</text>
  <text x="800" y="230" text-anchor="middle" class="body" font-size="21" fill="#5c6978">Designing and governing the full system that gets work done</text>
