      <path d="M45 6c-16-12-36 3-30 21-16 3-18 27-2 33-9 14 4 31 18 27 5 15 29 13 33-4 14 8 32-6 26-22 15-8 10-31-6-33 2-17-21-28-35-15z"/>
      <path d="M48 12v86M23 32h24M48 49h30M21 68h27M48 82h25"/>
      <circle cx="21" cy="32" r="4" fill="#75c9ff" stroke="none"/><circle cx="78" cy="49" r="4" fill="#75c9ff" stroke="none"/><circle cx="20" cy="68" r="4" fill="#75c9ff" stroke="none"/><circle cx="73" cy="82" r="4" fill="#75c9ff" stroke="none"/>
    </g>
    <text x="100" y="206" class="card-title"><tspan x="100">Corporate</tspan><tspan x="100" dy="38">knowledge</tspan></text>
  </g>

  <g transform="translate(590 485)">
    <rect width="200" height="275" rx="18" fill="#0a1b31" stroke="#63c5ff" stroke-width="2.4"/>
    <g transform="translate(50 37)" class="icon-orange">
      <path d="M50 0c20 16 38 20 50 24v35c0 28-18 51-50 66C18 110 0 87 0 59V24C12 20 30 16 50 0z"/>
      <path d="M25 61l17 17 34-38"/>
    </g>
    <text x="100" y="206" class="card-title"><tspan x="100">Runtime</tspan><tspan x="100" dy="38">governance</tspan></text>
  </g>

  <g transform="translate(840 485)">
    <rect width="200" height="275" rx="18" fill="#0a1b31" stroke="#63c5ff" stroke-width="2.4"/>
    <g transform="translate(45 47)" class="icon-blue">
      <circle cx="55" cy="22" r="17"/>
      <circle cx="20" cy="42" r="13"/>
      <circle cx="90" cy="42" r="13"/>
      <path d="M24 104v-25c0-20 14-31 31-31s31 11 31 31v25"/>
      <path d="M0 104V78c0-14 9-23 22-23M110 104V78c0-14-9-23-22-23"/>
    </g>
    <text x="100" y="206" class="card-title"><tspan x="100">Specialist</tspan><tspan x="100" dy="38">agents</tspan></text>
  </g>

  <g transform="translate(1090 485)">
    <rect width="200" height="275" rx="18" fill="#0a1b31" stroke="#63c5ff" stroke-width="2.4"/>
    <g transform="translate(48 42)" class="icon-blue">
      <ellipse cx="52" cy="18" rx="42" ry="18"/>
      <path d="M10 18v56c0 10 19 18 42 18s42-8 42-18V18"/>
      <path d="M10 44c0 10 19 18 42 18s42-8 42-18M10 70c0 10 19 18 42 18s42-8 42-18"/>
    </g>
    <text x="100" y="206" class="card-title"><tspan x="100">ERP</tspan><tspan x="100" dy="38">execution</tspan></text>
  </g>

  <g transform="translate(1340 485)">
    <rect width="200" height="275" rx="18" fill="#21120d" stroke="#ff8a1f" stroke-width="2.8"/>
    <g transform="translate(53 40)" class="icon-orange">
      <rect x="7" y="0" width="80" height="105" rx="9"/>
      <circle cx="47" cy="40" r="22"/>
      <path d="M25 40h44M47 18c-11 12-11 32 0 44M47 18c11 12 11 32 0 44"/>
      <circle cx="75" cy="88" r="18" fill="#181014"/>
      <path d="M66 88l7 7 13-16"/>
    </g>
    <text x="100" y="206" class="card-title"><tspan x="100">Decision</tspan><tspan x="100" dy="38">passport</tspan></text>
  </g>
