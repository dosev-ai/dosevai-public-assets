      <path d="M12 0h48l28 28v70H12z"/>
      <path d="M60 0v28h28"/>
      <path d="M28 46h38M28 62h38M28 78h30"/>
      <path d="M0 18v94h76" opacity="0.65"/>
    </g>
    <text x="100" y="206" class="card-title"><tspan x="100">Existing</tspan><tspan x="100" dy="38">standards</tspan></text>
  </g>

