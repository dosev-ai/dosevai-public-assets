<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Missing Infrastructure for Finance Agents</title>
  <desc id="desc">Dark navy infographic showing a governed flow from existing standards through corporate knowledge, runtime governance, specialist agents and ERP execution to a decision passport.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030814"/>
      <stop offset="0.62" stop-color="#071426"/>
      <stop offset="1" stop-color="#100b08"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="28%" r="55%">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ff7a1a" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c213b" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#071327" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="finalCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29170f" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#100d13" stop-opacity="0.98"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#28496b" stroke-width="1" opacity="0.18"/>
    </pattern>
    <style>
      .display { font-family: Arial, Helvetica, sans-serif; font-weight: 800; }
      .body { font-family: Arial, Helvetica, sans-serif; }
      .card-title { font-family: Arial, Helvetica, sans-serif; font-weight: 600; font-size: 29px; fill: #f6f7fb; text-anchor: middle; }
      .icon-blue { fill: none; stroke: #75c9ff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .icon-orange { fill: none; stroke: #ff8a1f; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.52"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <path d="M0 895 C 300 760, 640 760, 990 895" fill="none" stroke="#1e4c78" stroke-width="2" opacity="0.22"/>
  <path d="M0 860 C 300 735, 665 745, 1060 900" fill="none" stroke="#ff7a1a" stroke-width="1.5" opacity="0.15"/>

  <text x="86" y="130" class="display" font-size="82" fill="#fbfbfd">The Missing</text>
  <text x="86" y="235" class="display" font-size="82" fill="#fbfbfd">Infrastructure</text>
  <text x="86" y="340" class="display" font-size="82" fill="#fbfbfd">for <tspan fill="#ff7817">Finance Agents</tspan></text>
  <rect x="88" y="386" width="7" height="45" rx="3.5" fill="#ff7817"/>
  <text x="116" y="422" class="body" font-size="40" fill="#9ca9c2">A governed decision-control layer</text>

  <g stroke="#ff8a1f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M294 603h28m-10-12 12 12-12 12"/>
    <path d="M544 603h28m-10-12 12 12-12 12"/>
    <path d="M794 603h28m-10-12 12 12-12 12"/>
    <path d="M1044 603h28m-10-12 12 12-12 12"/>
    <path d="M1294 603h28m-10-12 12 12-12 12"/>
  </g>

  <g transform="translate(90 485)">
    <rect width="200" height="275" rx="18" fill="#0a1b31" stroke="#63c5ff" stroke-width="2.4"/>
