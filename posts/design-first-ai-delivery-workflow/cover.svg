<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Governed Delivery Loop</title>
  <desc id="desc">A seven-stage governed delivery workflow. A reviewed high-level plan in Action Worker moves through PRD and ADR pull requests with review and repair cycles, returns to Action Worker as an execution graph, continues to Claude Code execution, parallel Codex and Copilot review, and finishes with validation, UAT, human approval, and feedback to future planning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2f4a"/></marker>
    <style>
      .title{font:700 44px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0b1730;letter-spacing:.2px}.subtitle{font:400 21px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#33415c}.stageTitle{font:700 20px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f2742}.stageBody{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#26354f}.small{font:600 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#26354f}.label{font:700 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.principleTitle{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#18324e}.principleBody{font:400 13.5px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#33415c}.num{font:700 19px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.card{fill:#fff;stroke-width:1.5}.flow{fill:none;stroke:#1f2f4a;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text class="title" x="800" y="58" text-anchor="middle">The Governed Delivery Loop</text>
  <text class="subtitle" x="800" y="95" text-anchor="middle">Plan in Action Worker. Verify the design. Decompose with confidence. Execute. Review in parallel. Validate. Ship.</text>
  <path class="flow" d="M210 355 H252"/><path class="flow" d="M448 355 H500"/><path class="flow" d="M696 355 H748"/><path class="flow" d="M944 355 H986"/><path class="flow" d="M1182 355 H1210"/><path class="flow" d="M1420 355 H1442"/>
  <circle cx="116" cy="151" r="21" fill="#0d9b55"/><text class="num" x="116" y="158" text-anchor="middle">1</text>
  <rect class="card" x="24" y="184" width="186" height="350" rx="18" stroke="#1f9b5c"/>
  <g transform="translate(70 218)"><rect x="8" y="0" width="76" height="76" rx="12" fill="#e9f7ef" stroke="#1f9b5c"/><path d="M28 16 h36 v44 H28z M36 8 h20 v16 H36z" fill="none" stroke="#136c42" stroke-width="5" stroke-linejoin="round"/><circle cx="63" cy="58" r="16" fill="#136c42"/><path d="M55 58 l6 6 11-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="stageTitle" x="117" y="330" text-anchor="middle">Action Worker</text><text class="stageTitle" x="117" y="356" text-anchor="middle" fill="#166c43">Plan</text>
  <text class="stageBody" x="117" y="395" text-anchor="middle"><tspan x="117">High-level plan,</tspan><tspan x="117" dy="22">objectives, phases,</tspan><tspan x="117" dy="22">dependencies,</tspan><tspan x="117" dy="22">risks and constraints</tspan></text><text class="label" x="117" y="560" text-anchor="middle" fill="#167249">Reviewed plan</text>
  <circle cx="350" cy="151" r="21" fill="#1f6fcc"/><text class="num" x="350" y="158" text-anchor="middle">2</text>
  <rect class="card" x="252" y="184" width="196" height="350" rx="18" stroke="#4c8ee8"/>
  <g transform="translate(307 214)"><path d="M12 0 h60 l26 26 v94 H12z" fill="#f2f7ff" stroke="#2c73c9" stroke-width="2.4"/><path d="M72 0 v28 h26" fill="#dceaff" stroke="#2c73c9" stroke-width="2.4"/><rect x="10" y="8" width="55" height="26" rx="5" fill="#2d7acb"/><text x="38" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#fff">PRD</text><path d="M30 52 h46 M30 70 h46 M30 88 h46" stroke="#2c73c9" stroke-width="3" stroke-linecap="round"/><path d="M22 50 l4 4 7-8 M22 68 l4 4 7-8 M22 86 l4 4 7-8" fill="none" stroke="#2c73c9" stroke-width="2.6" stroke-linecap="round"/></g>
  <text class="stageTitle" x="350" y="359" text-anchor="middle" fill="#1f5fa8">PRD Pull Request</text><text class="stageBody" x="350" y="397" text-anchor="middle"><tspan x="350">Product intent,</tspan><tspan x="350" dy="21">requirements,</tspan><tspan x="350" dy="21">acceptance criteria,</tspan><tspan x="350" dy="21">constraints, non-goals</tspan></text><text class="label" x="350" y="560" text-anchor="middle" fill="#1f6fcc">Merge = product authority</text>
  <circle cx="598" cy="151" r="21" fill="#6446b8"/><text class="num" x="598" y="158" text-anchor="middle">3</text>
  <rect class="card" x="500" y="184" width="196" height="350" rx="18" stroke="#8b69d1"/>
  <g transform="translate(555 214)"><path d="M12 0 h60 l26 26 v94 H12z" fill="#f6f3ff" stroke="#6844b7" stroke-width="2.4"/><path d="M72 0 v28 h26" fill="#e8defd" stroke="#6844b7" stroke-width="2.4"/><rect x="10" y="8" width="55" height="26" rx="5" fill="#6844b7"/><text x="38" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#fff">ADR</text><path d="M30 52 h46 M30 70 h46 M30 88 h46" stroke="#6844b7" stroke-width="3" stroke-linecap="round"/></g>
  <text class="stageTitle" x="598" y="359" text-anchor="middle" fill="#583c9d">ADR Pull Request</text><text class="stageBody" x="598" y="397" text-anchor="middle"><tspan x="598">Architecture decisions,</tspan><tspan x="598" dy="21">options, trade-offs,</tspan><tspan x="598" dy="21">consequences, migration,</tspan><tspan x="598" dy="21">rollback and validation</tspan></text><text class="label" x="598" y="560" text-anchor="middle" fill="#6446b8">Merge = architecture authority</text>
  <circle cx="846" cy="151" r="21" fill="#159750"/><text class="num" x="846" y="158" text-anchor="middle">4</text>
  <rect class="card" x="748" y="184" width="196" height="350" rx="18" stroke="#299b60"/>
  <g transform="translate(790 223)" stroke="#12683f" stroke-width="4" fill="#1d9a59"><path d="M25 25 H78 M25 25 V82 M78 25 V82 M25 82 H78 M78 82 H113" fill="none"/><rect x="13" y="13" width="24" height="24" rx="3"/><rect x="66" y="13" width="24" height="24" rx="3"/><rect x="13" y="70" width="24" height="24" rx="3"/><rect x="66" y="70" width="24" height="24" rx="3"/><rect x="101" y="70" width="24" height="24" rx="3"/><circle cx="110" cy="112" r="17" fill="#12683f" stroke="none"/><path d="M102 112 l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="stageTitle" x="846" y="359" text-anchor="middle">Action Worker</text><text class="stageTitle" x="846" y="385" text-anchor="middle" fill="#166c43">Execution Graph</text><text class="stageBody" x="846" y="421" text-anchor="middle"><tspan x="846">Epics, actions,</tspan><tspan x="846" dy="21">dependencies, review and</tspan><tspan x="846" dy="21">validation checkpoints</tspan></text><text class="label" x="846" y="560" text-anchor="middle" fill="#167249">Decomposed and ready</text>
  <circle cx="1084" cy="151" r="21" fill="#eb6a13"/><text class="num" x="1084" y="158" text-anchor="middle">5</text>
  <rect class="card" x="986" y="184" width="196" height="350" rx="18" stroke="#f07a2a"/>
  <g transform="translate(1036 218)"><path d="M48 0 l46 27 v54 l-46 27 L2 81 V27z" fill="#f27921"/><g stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M48 23 v23"/><path d="M48 62 v23"/><path d="M21 54 h23"/><path d="M52 54 h23"/><path d="M29 35 l15 15"/><path d="M52 58 l15 15"/><path d="M67 35 L52 50"/><path d="M44 58 L29 73"/></g></g>
  <text class="stageTitle" x="1084" y="359" text-anchor="middle" fill="#d85a08">Claude Code</text><text class="stageTitle" x="1084" y="385" text-anchor="middle" fill="#d85a08">Execution</text><text class="stageBody" x="1084" y="423" text-anchor="middle"><tspan x="1084">Implements bounded</tspan><tspan x="1084" dy="21">actions against approved</tspan><tspan x="1084" dy="21">design and constraints</tspan></text>
  <circle cx="1315" cy="151" r="21" fill="#dba407"/><text class="num" x="1315" y="158" text-anchor="middle">6</text>
  <rect class="card" x="1210" y="184" width="210" height="162" rx="18" stroke="#4c8ee8"/><g transform="translate(1228 212)"><path d="M18 0 h34 l18 18 v34 L52 70 H18 L0 52 V18z" fill="#2778c8"/><text x="35" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#fff">&lt;/&gt;</text></g><text x="1312" y="234" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1f5fa8">Codex review</text><text x="1312" y="266" font-family="system-ui,sans-serif" font-size="14" fill="#26354f"><tspan x="1312">Independent</tspan><tspan x="1312" dy="20">PR review</tspan></text>
  <rect class="card" x="1210" y="372" width="210" height="162" rx="18" stroke="#8b69d1"/><g transform="translate(1228 400)"><path d="M18 0 h34 l18 18 v34 L52 70 H18 L0 52 V18z" fill="#6f53c4"/><rect x="20" y="22" width="30" height="27" rx="6" fill="none" stroke="#fff" stroke-width="3"/><circle cx="29" cy="35" r="2.6" fill="#fff"/><circle cx="41" cy="35" r="2.6" fill="#fff"/><path d="M27 43 q8 7 16 0" fill="none" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/></g><text x="1312" y="422" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#5d42a6">Copilot review</text><text x="1312" y="454" font-family="system-ui,sans-serif" font-size="14" fill="#26354f"><tspan x="1312">Independent</tspan><tspan x="1312" dy="20">PR review</tspan></text><path d="M1315 346 V372" stroke="#33415c" stroke-width="2" stroke-dasharray="5 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <circle cx="1517" cy="151" r="21" fill="#dba407"/><text class="num" x="1517" y="158" text-anchor="middle">7</text><rect class="card" x="1442" y="184" width="150" height="350" rx="18" stroke="#d6aa21"/><g transform="translate(1471 220)"><path d="M46 0 l46 20 v43 c0 35-20 59-46 76C20 122 0 98 0 63V20z" fill="#e1ad09"/><path d="M27 66 l13 13 27-31" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="stageTitle" x="1517" y="382" text-anchor="middle" fill="#ae7c00">Validation</text><text class="stageTitle" x="1517" y="408" text-anchor="middle" fill="#ae7c00">and release</text><text class="stageBody" x="1517" y="446" text-anchor="middle"><tspan x="1517">CI, tests, runtime,</tspan><tspan x="1517" dy="21">UAT and human</tspan><tspan x="1517" dy="21">approval</tspan></text><text class="label" x="1517" y="560" text-anchor="middle" fill="#b58400">Done right</text>
  <g transform="translate(432 248)"><circle cx="42" cy="76" r="38" fill="#fff" stroke="#1f6fcc" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M70 43 a37 37 0 0 1 3 55" fill="none" stroke="#1f6fcc" stroke-width="3" marker-end="url(#arrow)"/><text class="small" x="42" y="70" text-anchor="middle" fill="#1f5fa8">Review</text><text class="small" x="42" y="90" text-anchor="middle" fill="#1f5fa8">and repair</text><text class="small" x="42" y="110" text-anchor="middle" fill="#1f5fa8">cycles</text></g>
  <g transform="translate(680 248)"><circle cx="42" cy="76" r="38" fill="#fff" stroke="#6446b8" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M70 43 a37 37 0 0 1 3 55" fill="none" stroke="#6446b8" stroke-width="3" marker-end="url(#arrow)"/><text class="small" x="42" y="70" text-anchor="middle" fill="#583c9d">Review</text><text class="small" x="42" y="90" text-anchor="middle" fill="#583c9d">and repair</text><text class="small" x="42" y="110" text-anchor="middle" fill="#583c9d">cycles</text></g>
  <path d="M1517 585 V635 H115 V584" fill="none" stroke="#1f2f4a" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="552" y="608" width="496" height="55" rx="18" fill="#fff" stroke="#9da9ba"/><text class="subtitle" x="800" y="644" text-anchor="middle" font-size="18">Feedback informs the plan and future decisions</text>
  <rect x="80" y="700" width="1440" height="150" rx="22" fill="#fff" stroke="#b9c2cf" stroke-width="1.4"/><line x1="360" y1="724" x2="360" y2="827" stroke="#c6ced8"/><line x1="650" y1="724" x2="650" y2="827" stroke="#c6ced8"/><line x1="940" y1="724" x2="940" y2="827" stroke="#c6ced8"/><line x1="1230" y1="724" x2="1230" y2="827" stroke="#c6ced8"/>
  <g transform="translate(110 727)"><circle cx="32" cy="34" r="27" fill="#eaf7ef" stroke="#168f51" stroke-width="2"/><circle cx="32" cy="34" r="14" fill="none" stroke="#168f51" stroke-width="3"/><path d="M32 34 l18-20" stroke="#168f51" stroke-width="4" marker-end="url(#arrow)"/><text class="principleTitle" x="76" y="16" fill="#117243">Design authority</text><text class="principleTitle" x="76" y="38" fill="#117243">before code</text><text class="principleBody" x="76" y="68"><tspan x="76">PRD and ADR survive</tspan><tspan x="76" dy="19">review before implementation.</tspan></text></g>
  <g transform="translate(390 727)"><path d="M18 20 h36 M36 20 v48 M18 68 h36" fill="none" stroke="#236ec2" stroke-width="3"/><circle cx="18" cy="20" r="7" fill="#fff" stroke="#236ec2" stroke-width="3"/><circle cx="54" cy="20" r="7" fill="#fff" stroke="#236ec2" stroke-width="3"/><circle cx="18" cy="68" r="7" fill="#fff" stroke="#236ec2" stroke-width="3"/><circle cx="54" cy="68" r="7" fill="#fff" stroke="#236ec2" stroke-width="3"/><text class="principleTitle" x="84" y="16" fill="#1d5da8">Separation of roles</text><text class="principleBody" x="84" y="46"><tspan x="84">Plan, execute and review</tspan><tspan x="84" dy="19">in distinct lanes.</tspan></text></g>
  <g transform="translate(680 727)"><path d="M30 0 l30 12 v27 c0 24-13 41-30 52C13 80 0 63 0 39V12z" fill="#f0ebff" stroke="#6648b8" stroke-width="2.5"/><path d="M18 45 l8 8 17-20" fill="none" stroke="#6648b8" stroke-width="4" stroke-linecap="round"/><text class="principleTitle" x="82" y="16" fill="#5e43a9">Independent review</text><text class="principleTitle" x="82" y="38" fill="#5e43a9">in parallel</text><text class="principleBody" x="82" y="68"><tspan x="82">Fresh reviewers catch</tspan><tspan x="82" dy="19">different issue classes.</tspan></text></g>
  <g transform="translate(970 727)"><circle cx="30" cy="35" r="28" fill="#fff4e9" stroke="#e96a12" stroke-width="2.5"/><path d="M16 35 l10 10 20-24" fill="none" stroke="#e96a12" stroke-width="4" stroke-linecap="round"/><text class="principleTitle" x="78" y="16" fill="#d75c0a">Evidence over assumptions</text><text class="principleBody" x="78" y="46"><tspan x="78">Tests, runtime checks and UAT</tspan><tspan x="78" dy="19">prove the result works.</tspan></text></g>
  <g transform="translate(1260 727)"><circle cx="30" cy="23" r="14" fill="none" stroke="#167249" stroke-width="3"/><path d="M5 78 v-12 c0-17 11-27 25-27s25 10 25 27v12z" fill="#eaf7ef" stroke="#167249" stroke-width="3"/><text class="principleTitle" x="82" y="16" fill="#12683f">Human in the loop</text><text class="principleBody" x="82" y="46"><tspan x="82">Human ownership for decisions,</tspan><tspan x="82" dy="19">dispositions and release.</tspan></text></g>
</svg>
