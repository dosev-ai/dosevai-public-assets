<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI Is Becoming a Regulated Industry. Don't Let Regulation Become the Moat.</title>
<desc id="desc">A minimal executive cover with two paths, Capability and Rulebook, converging on a central frontier-capability gate. The gate is tested for safety, competition and replaceability, illustrating regulation that constrains risk without entrenching incumbents.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFAF5"/><stop offset="1" stop-color="#F7F2E8"/></linearGradient>
  <linearGradient id="gateFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B2139"/><stop offset="1" stop-color="#071629"/></linearGradient>
  <style>
    .display{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:.4px}
    .body{font-family:Arial,Helvetica,sans-serif}
    .lane{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:800;fill:#10233B;letter-spacing:.6px}
    .small{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#575751}
  </style>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#49749A"/></marker>
  <marker id="arrowCopper" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C46F3B"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#paper)"/>
<rect x="0" y="0" width="1600" height="18" fill="#071629"/>
<text x="95" y="118" class="display" font-size="58" fill="#071629">AI IS BECOMING A REGULATED INDUSTRY.</text>
<text x="95" y="188" class="display" font-size="54" fill="#C46F3B">DON'T LET REGULATION BECOME THE MOAT.</text>
<text x="98" y="242" class="body" font-size="27" fill="#575751">Frontier AI needs strong rules - without turning compliance into an incumbent-only gate.</text>

<g opacity="0.16" fill="#49749A">
  <rect x="60" y="450" width="70" height="240"/><rect x="145" y="400" width="105" height="290"/><rect x="270" y="470" width="78" height="220"/>
  <rect x="1240" y="445" width="92" height="245"/><rect x="1350" y="395" width="80" height="295"/><rect x="1450" y="460" width="90" height="230"/>
</g>

<g transform="translate(612 338)">
  <rect x="0" y="160" width="376" height="255" rx="20" fill="url(#gateFill)" stroke="#C46F3B" stroke-width="5"/>
  <path d="M72 160V82L188 20L304 82V160" fill="#0B2139" stroke="#C46F3B" stroke-width="5"/>
  <rect x="122" y="212" width="132" height="203" rx="62" fill="#F7F2E8" stroke="#C46F3B" stroke-width="4"/>
  <line x1="188" y1="218" x2="188" y2="408" stroke="#C46F3B" stroke-width="3" opacity=".7"/>
  <text x="188" y="118" text-anchor="middle" class="display" font-size="28" fill="#FFFFFF">FRONTIER</text>
  <text x="188" y="151" text-anchor="middle" class="display" font-size="28" fill="#FFFFFF">CAPABILITY</text>
</g>

<path d="M190 486C380 430 500 438 640 505" fill="none" stroke="#49749A" stroke-width="8" marker-end="url(#arrowBlue)"/>
<path d="M1410 486C1220 430 1100 438 960 505" fill="none" stroke="#C46F3B" stroke-width="8" marker-end="url(#arrowCopper)"/>
<circle cx="190" cy="486" r="62" fill="#FFFFFF" stroke="#49749A" stroke-width="5"/>
<path d="M160 507l30-50 30 50M176 481h28" fill="none" stroke="#49749A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="190" y="581" text-anchor="middle" class="lane">CAPABILITY</text>
<text x="190" y="613" text-anchor="middle" class="small">Models. Compute. Deployment.</text>
<circle cx="1410" cy="486" r="62" fill="#FFFFFF" stroke="#C46F3B" stroke-width="5"/>
<path d="M1376 463h68v52h-68zM1392 451v12M1428 451v12M1388 480h44M1388 496h32" fill="none" stroke="#C46F3B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1410" y="581" text-anchor="middle" class="lane">RULEBOOK</text>
<text x="1410" y="613" text-anchor="middle" class="small">Thresholds. Evals. Market access.</text>

<g transform="translate(320 737)">
  <rect width="960" height="92" rx="46" fill="#FFFFFF" stroke="#DDD4C7" stroke-width="3"/>
  <circle cx="70" cy="46" r="26" fill="none" stroke="#2F7D5B" stroke-width="5"/><path d="M57 46l9 10 18-22" fill="none" stroke="#2F7D5B" stroke-width="5" stroke-linecap="round"/>
  <text x="115" y="55" class="display" font-size="24" fill="#10233B">SAFETY</text>
  <line x1="320" y1="20" x2="320" y2="72" stroke="#DDD4C7" stroke-width="2"/>
  <circle cx="390" cy="46" r="25" fill="none" stroke="#A86A2A" stroke-width="5"/><path d="M371 46h38M390 27v38" stroke="#A86A2A" stroke-width="4"/>
  <text x="435" y="55" class="display" font-size="23" fill="#10233B">COMPETITION</text>
  <line x1="640" y1="20" x2="640" y2="72" stroke="#DDD4C7" stroke-width="2"/>
  <circle cx="710" cy="46" r="25" fill="none" stroke="#49749A" stroke-width="5"/><path d="M698 37l-12 9 12 9M722 37l12 9-12 9" fill="none" stroke="#49749A" stroke-width="4" stroke-linecap="round"/>
  <text x="755" y="55" class="display" font-size="22" fill="#10233B">REPLACEABILITY</text>
</g>
</svg>
