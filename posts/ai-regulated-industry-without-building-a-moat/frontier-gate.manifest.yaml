semantic_description: >-
  The diagram has two source lanes: Capability Race and Rulebook Race. They converge on a central Frontier Capability gate, which then points to three design tests. Safety asks whether rules constrain measurable risk. Competition asks whether credible entrants can meet the same bar. Replaceability asks whether critical users can switch providers without losing safety, evidence, continuity or lawful control.
claims:
  - Frontier capability and frontier governance standards can evolve in parallel.
  - Regulatory design can be tested for measurable safety outcomes, competitive accessibility and supplier replaceability.
boundaries:
