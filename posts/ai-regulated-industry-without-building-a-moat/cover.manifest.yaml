title: AI Is Becoming a Regulated Industry. Don't Let Regulation Become the Moat.
alt: >-
  Two paths labelled Capability and Rulebook converge on a central frontier-capability gate, with Safety, Competition and Replaceability shown as the tests for good regulation.
caption: >-
  The frontier race now has two tracks: capability and the rulebook. Regulation must constrain risk without making the gate affordable only to incumbents.
semantic_description: >-
  A light executive cover uses an abstract gate as the central metaphor. The Capability path and the Rulebook path converge on frontier capability. A lower strip names Safety, Competition and Replaceability as the three tests. The visual presents regulation as a control point and does not imply conspiracy, coordination, monopoly intent or that frontier models are weapons.
claims:
  - Frontier AI competition increasingly includes both capability and governance standards.
  - A regulatory design can be evaluated for safety, competition and replaceability.
boundaries:
  - The visual does not allege collusion, regulatory capture intent or monopoly intent by any model provider.
  - The visual does not equate frontier AI with weapons or imply that all AI use requires licensing.
  - The visual is an editorial synthesis, not a statement of settled global regulation.
