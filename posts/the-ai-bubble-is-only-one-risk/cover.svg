<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The AI Bubble Is Only One Risk</title>
<desc id="desc">A minimal executive cover showing a solid production dependency chain from power to compute to models to enterprise workflows. A lighter dashed market bubble surrounds compute and models, while the dependency chain continues through it. A lower strip reads Price, Serviceable Volume and Mix.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFAF5"/><stop offset="1" stop-color="#F7F2E8"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B2139"/><stop offset="1" stop-color="#071629"/></linearGradient>
  <style>
    .display{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:.4px}
    .body{font-family:Arial,Helvetica,sans-serif}
    .node{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:800;fill:#10233B;letter-spacing:.8px}
    .small{font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#575751}
  </style>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#49749A"/></marker>
</defs>

<rect width="1600" height="900" fill="url(#paper)"/>
<rect x="0" y="0" width="1600" height="18" fill="#071629"/>

<text x="95" y="118" class="display" font-size="63" fill="#071629">THE AI BUBBLE IS ONLY ONE RISK</text>
<text x="98" y="183" class="display" font-size="36" fill="#C46F3B">THE BUBBLE CAN BURST. THE DEPENDENCY CAN REMAIN.</text>
<text x="98" y="232" class="body" font-size="26" fill="#575751">When AI becomes a production input, price is only one part of the exposure.</text>

<ellipse cx="800" cy="505" rx="365" ry="225" fill="#C46F3B" fill-opacity=".055" stroke="#C46F3B" stroke-width="5" stroke-dasharray="17 14"/>
<path d="M1123 421c34 31 52 67 56 111" fill="none" stroke="#C46F3B" stroke-width="8" stroke-linecap="round"/>
<circle cx="1184" cy="555" r="7" fill="#C46F3B"/>
<text x="800" y="318" text-anchor="middle" class="display" font-size="23" fill="#A85F34">MARKET / VALUATION CYCLE</text>

<line x1="210" y1="505" x2="1390" y2="505" stroke="#49749A" stroke-width="10" opacity=".22"/>
<path d="M285 505H473" stroke="#49749A" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
<path d="M625 505H813" stroke="#49749A" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
<path d="M965 505H1153" stroke="#49749A" stroke-width="7" fill="none" marker-end="url(#arrow)"/>

<g transform="translate(165 425)">
  <circle cx="80" cy="80" r="72" fill="#FFFFFF" stroke="#2F7D5B" stroke-width="5"/>
  <path d="M92 28L54 88h34l-15 44 43-63H82z" fill="none" stroke="#2F7D5B" stroke-width="7" stroke-linejoin="round"/>
</g>
<text x="245" y="618" text-anchor="middle" class="node">POWER</text>
<text x="245" y="648" text-anchor="middle" class="small">Grid. Datacentres.</text>

<g transform="translate(505 425)">
  <rect x="8" y="8" width="144" height="144" rx="28" fill="#FFFFFF" stroke="#49749A" stroke-width="5"/>
  <rect x="49" y="49" width="62" height="62" rx="9" fill="none" stroke="#49749A" stroke-width="6"/>
  <path d="M33 20v20M65 20v20M97 20v20M129 20v20M33 120v20M65 120v20M97 120v20M129 120v20M20 33h20M20 65h20M20 97h20M20 129h20M120 33h20M120 65h20M120 97h20M120 129h20" stroke="#49749A" stroke-width="4" stroke-linecap="round"/>
</g>
<text x="585" y="618" text-anchor="middle" class="node">COMPUTE</text>
<text x="585" y="648" text-anchor="middle" class="small">Chips. Memory. Capacity.</text>

<g transform="translate(845 425)">
  <circle cx="80" cy="80" r="72" fill="url(#navy)" stroke="#C46F3B" stroke-width="5"/>
  <circle cx="58" cy="64" r="10" fill="#F7F2E8"/>
  <circle cx="102" cy="64" r="10" fill="#F7F2E8"/>
  <circle cx="80" cy="104" r="10" fill="#F7F2E8"/>
  <path d="M65 69l11 26M95 69L84 95M68 64h24" stroke="#F7F2E8" stroke-width="4" fill="none" stroke-linecap="round"/>
</g>
<text x="925" y="618" text-anchor="middle" class="node">MODELS</text>
<text x="925" y="648" text-anchor="middle" class="small">Capability. Routing. Mix.</text>

<g transform="translate(1185 425)">
  <rect x="6" y="14" width="148" height="132" rx="22" fill="#FFFFFF" stroke="#10233B" stroke-width="5"/>
  <circle cx="45" cy="54" r="14" fill="none" stroke="#C46F3B" stroke-width="5"/>
  <circle cx="115" cy="54" r="14" fill="none" stroke="#2F7D5B" stroke-width="5"/>
  <circle cx="80" cy="108" r="14" fill="none" stroke="#49749A" stroke-width="5"/>
  <path d="M56 59l17 36M104 59L87 95M58 54h43" stroke="#10233B" stroke-width="4" fill="none" stroke-linecap="round"/>
</g>
<text x="1265" y="618" text-anchor="middle" class="node">WORKFLOWS</text>
<text x="1265" y="648" text-anchor="middle" class="small">Operations. Controls. Exit risk.</text>

<g transform="translate(270 735)">
  <rect width="1060" height="94" rx="47" fill="#FFFFFF" stroke="#DDD4C7" stroke-width="3"/>
  <text x="132" y="58" text-anchor="middle" class="display" font-size="25" fill="#10233B">PRICE</text>
  <line x1="270" y1="20" x2="270" y2="74" stroke="#DDD4C7" stroke-width="2"/>
  <text x="530" y="58" text-anchor="middle" class="display" font-size="25" fill="#10233B">SERVICEABLE VOLUME</text>
  <line x1="790" y1="20" x2="790" y2="74" stroke="#DDD4C7" stroke-width="2"/>
  <text x="925" y="58" text-anchor="middle" class="display" font-size="25" fill="#10233B">MIX</text>
  <text x="270" y="58" text-anchor="middle" class="display" font-size="30" fill="#C46F3B">×</text>
  <text x="790" y="58" text-anchor="middle" class="display" font-size="30" fill="#C46F3B">×</text>
</g>
</svg>
