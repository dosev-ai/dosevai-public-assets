    <line x1="280" y1="819" x2="1320" y2="819" stroke="#7da4d1" stroke-width="2" stroke-dasharray="7 7"/>
    <circle cx="250" cy="819" r="29" fill="#e8f5ed" stroke="#1f8b4c" stroke-width="2"/>
    <path d="M238 807 H260 V831 H238 Z M242 813 H256 M242 819 H256 M242 825 H256" fill="none" stroke="#1f8b4c" stroke-width="2"/>
