    <text x="406" y="692" text-anchor="middle" class="tiny">B</text>
    <text x="464" y="692" text-anchor="middle" class="tiny">C</text>
  </g>
  <line x1="535" y1="475" x2="568" y2="475" stroke="#1f8b4c" stroke-width="6" marker-end="url(#arrowGreen)"/>
  <line x1="1025" y1="475" x2="1083" y2="475" stroke="#2667c9" stroke-width="6" marker-end="url(#arrowBlue)"/>
  <g aria-label="Deterministic workflow specification">
    <rect x="575" y="225" width="450" height="510" rx="18" fill="#ffffff" stroke="#7ca7df" stroke-width="2"/>
    <text x="800" y="262" text-anchor="middle" class="cardTitle blue">DECK SPECIFICATION</text>
    <rect x="605" y="282" width="390" height="130" rx="12" fill="#f4f8fe" stroke="#b7cdea"/>
    <text x="628" y="312" class="small blue">input</text><text x="710" y="312" class="small">synthetic-report.xlsx</text>
    <text x="628" y="340" class="small blue">slides</text><text x="710" y="340" class="small">title, summary, detail</text>
    <text x="628" y="368" class="small blue">controls</text><text x="710" y="368" class="small">approved paths, write confirmation</text>
    <text x="628" y="396" class="small blue">output</text><text x="710" y="396" class="small">executive-summary.pptx</text>
    <circle cx="953" cy="326" r="26" fill="#eaf2ff" stroke="#2667c9" stroke-width="2"/>
    <text x="953" y="333" text-anchor="middle" style="font-family:monospace;font-size:20px;font-weight:700;fill:#2667c9">{ }</text>
    <g>
      <line x1="650" y1="445" x2="650" y2="650" stroke="#9ab9df" stroke-width="3"/>
      <circle cx="650" cy="468" r="7" fill="#2667c9"/><circle cx="650" cy="532" r="7" fill="#2667c9"/><circle cx="650" cy="596" r="7" fill="#2667c9"/><circle cx="650" cy="650" r="7" fill="#2667c9"/>
      <rect x="676" y="438" width="286" height="58" rx="12" fill="#f8fbff" stroke="#c8d8e8"/>
      <circle cx="708" cy="467" r="17" fill="#eaf2ff"/><path d="M699 467 H717 M708 458 V476" stroke="#2667c9" stroke-width="2"/>
      <text x="738" y="462" class="label">Ingest structured input</text><text x="738" y="481" class="tiny">Table shape and fields remain explicit</text>
      <circle cx="935" cy="467" r="14" fill="#e8f5ed"/><path d="M928 467 L933 472 L942 461" fill="none" stroke="#1f8b4c" stroke-width="2.5"/>
      <rect x="676" y="502" width="286" height="58" rx="12" fill="#f8fbff" stroke="#c8d8e8"/>
      <circle cx="708" cy="531" r="17" fill="#eaf2ff"/><path d="M699 531 H717 M708 522 V540" stroke="#2667c9" stroke-width="2"/>
      <text x="738" y="526" class="label">Normalize to deck_spec</text><text x="738" y="545" class="tiny">Content is bounded before slide writes</text>
      <circle cx="935" cy="531" r="14" fill="#e8f5ed"/><path d="M928 531 L933 536 L942 525" fill="none" stroke="#1f8b4c" stroke-width="2.5"/>
      <rect x="676" y="566" width="286" height="58" rx="12" fill="#f8fbff" stroke="#c8d8e8"/>
      <circle cx="708" cy="595" r="17" fill="#eaf2ff"/><rect x="699" y="587" width="18" height="15" rx="2" fill="none" stroke="#2667c9" stroke-width="2"/>
      <text x="738" y="590" class="label">Generate summary slides</text><text x="738" y="609" class="tiny">Title, KPI summary and detail table</text>
      <circle cx="935" cy="595" r="14" fill="#e8f5ed"/><path d="M928 595 L933 600 L942 589" fill="none" stroke="#1f8b4c" stroke-width="2.5"/>
      <rect x="676" y="630" width="286" height="58" rx="12" fill="#f8fbff" stroke="#c8d8e8"/>
      <circle cx="708" cy="659" r="17" fill="#eaf2ff"/><path d="M700 661 H716 V651 H700 Z" fill="none" stroke="#2667c9" stroke-width="2"/>
      <text x="738" y="654" class="label">Record artifact lineage</text><text x="738" y="673" class="tiny">Input, spec, output and validation linked</text>
      <circle cx="935" cy="659" r="14" fill="#e8f5ed"/><path d="M928 659 L933 664 L942 653" fill="none" stroke="#1f8b4c" stroke-width="2.5"/>
    </g>
    <rect x="605" y="699" width="390" height="24" rx="12" fill="#eaf2ff"/>
    <text x="800" y="716" text-anchor="middle" class="tiny blue">Path control • Write confirmation • Evidence record</text>
  </g>
