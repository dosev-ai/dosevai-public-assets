    <circle cx="600" cy="819" r="29" fill="#eaf2ff" stroke="#2667c9" stroke-width="2"/>
    <text x="600" y="827" text-anchor="middle" style="font-family:monospace;font-size:19px;font-weight:700;fill:#2667c9">{ }</text><text x="600" y="770" text-anchor="middle" class="label blue">SPEC</text><text x="600" y="852" text-anchor="middle" class="tiny">deck_spec.json</text>
    <circle cx="950" cy="819" r="29" fill="#eaf2ff" stroke="#2667c9" stroke-width="2"/>
    <path d="M938 819 L946 827 L963 809" fill="none" stroke="#2667c9" stroke-width="3" stroke-linecap="round"/>
    <text x="950" y="770" text-anchor="middle" class="label blue">CONTROLS</text><text x="950" y="852" text-anchor="middle" class="tiny">path + write gates</text>
    <circle cx="1300" cy="819" r="29" fill="#fff0e6" stroke="#e66a19" stroke-width="2"/>
    <rect x="1288" y="810" width="24" height="16" rx="2" fill="none" stroke="#e66a19" stroke-width="2"/>
    <text x="1300" y="770" text-anchor="middle" class="label orange">OUTPUT</text><text x="1300" y="852" text-anchor="middle" class="tiny">executive-summary.pptx</text>
