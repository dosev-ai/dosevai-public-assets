    <text x="92" y="383" class="small">Professional services</text>
    <text x="250" y="383" class="small">92</text>
    <text x="337" y="383" class="small">90</text>
    <rect x="416" y="369" width="64" height="22" rx="11" fill="#e8f5ed"/>
    <text x="448" y="384" text-anchor="middle" class="tiny green">On track</text>
    <text x="92" y="422" class="small">Software</text>
    <text x="250" y="422" class="small">84</text>
    <text x="337" y="422" class="small">90</text>
    <rect x="416" y="408" width="64" height="22" rx="11" fill="#fff0e6"/>
    <text x="448" y="423" text-anchor="middle" class="tiny orange">Review</text>
    <text x="92" y="461" class="small">Cloud services</text>
    <text x="250" y="461" class="small">88</text>
    <text x="337" y="461" class="small">85</text>
    <rect x="416" y="447" width="64" height="22" rx="11" fill="#e8f5ed"/>
    <text x="448" y="462" text-anchor="middle" class="tiny green">On track</text>
    <text x="92" y="500" class="small">Travel</text>
    <text x="250" y="500" class="small">76</text>
    <text x="337" y="500" class="small">85</text>
    <rect x="416" y="486" width="64" height="22" rx="11" fill="#fff0e6"/>
    <text x="448" y="501" text-anchor="middle" class="tiny orange">Review</text>
    <rect x="78" y="555" width="195" height="145" rx="12" fill="#f8fbff" stroke="#c8d8e8"/>
    <text x="94" y="580" class="label">Category mix</text>
    <circle cx="154" cy="632" r="43" fill="none" stroke="#d7e2ed" stroke-width="17"/>
    <path d="M154 589 A43 43 0 0 1 194 648" fill="none" stroke="#1f8b4c" stroke-width="17"/>
    <path d="M194 648 A43 43 0 0 1 132 669" fill="none" stroke="#2667c9" stroke-width="17"/>
    <path d="M132 669 A43 43 0 0 1 154 589" fill="none" stroke="#e66a19" stroke-width="17"/>
    <text x="154" y="636" text-anchor="middle" class="label">100%</text>
    <circle cx="219" cy="612" r="5" fill="#1f8b4c"/><text x="231" y="616" class="tiny">Core</text>
    <circle cx="219" cy="636" r="5" fill="#2667c9"/><text x="231" y="640" class="tiny">Growth</text>
    <circle cx="219" cy="660" r="5" fill="#e66a19"/><text x="231" y="664" class="tiny">Review</text>
    <rect x="290" y="555" width="212" height="145" rx="12" fill="#f8fbff" stroke="#c8d8e8"/>
    <text x="306" y="580" class="label">Current vs target</text>
    <line x1="316" y1="673" x2="478" y2="673" stroke="#b9cbe0"/>
    <rect x="328" y="618" width="18" height="55" fill="#1f8b4c"/>
    <rect x="350" y="605" width="18" height="68" fill="#c9d8e8"/>
    <rect x="386" y="634" width="18" height="39" fill="#1f8b4c"/>
    <rect x="408" y="604" width="18" height="69" fill="#c9d8e8"/>
    <rect x="444" y="623" width="18" height="50" fill="#1f8b4c"/>
    <rect x="466" y="611" width="18" height="62" fill="#c9d8e8"/>
