<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From Excel Data to an Executive PowerPoint</title>
  <desc id="desc">A three-stage governed workflow. A synthetic finance and procurement table on the left becomes a deterministic deck specification in the center, then executive summary and detail slides on the right. Path controls, write confirmation, and artifact lineage are shown as explicit checkpoints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="navySlide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#17385f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16324f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 Z" fill="#1f8b4c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 Z" fill="#2667c9"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 50px; font-weight: 700; fill: #10243f; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 27px; font-weight: 500; fill: #2667c9; }
      .section { font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 0.4px; }
      .sectionSub { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #334e68; }
      .cardTitle { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #10243f; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #243b53; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #526a82; }
      .tiny { font-family: Inter, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #526a82; }
      .white { fill: #ffffff; }
      .green { fill: #1f8b4c; }
      .blue { fill: #2667c9; }
      .orange { fill: #e66a19; }
      .navy { fill: #10243f; }
      .strokeSoft { stroke: #c9d8e8; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.25" stroke="#aac0d8" stroke-width="1">
    <path d="M0 140 H1600 M0 280 H1600 M0 420 H1600 M0 560 H1600 M0 700 H1600"/>
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900"/>
  </g>
  <text x="800" y="72" text-anchor="middle" class="title">From Excel Data to an Executive PowerPoint</text>
  <line x1="500" y1="112" x2="610" y2="112" stroke="#2667c9" stroke-width="2"/>
  <circle cx="500" cy="112" r="4" fill="#2667c9"/>
  <text x="800" y="121" text-anchor="middle" class="subtitle">A Governed MCP Workflow</text>
  <line x1="990" y1="112" x2="1100" y2="112" stroke="#2667c9" stroke-width="2"/>
  <circle cx="1100" cy="112" r="4" fill="#2667c9"/>
  <g aria-label="Stage one structured data">
    <rect x="70" y="155" width="42" height="42" rx="8" fill="#e8f5ed" stroke="#1f8b4c" stroke-width="2"/>
    <path d="M82 166 H100 V184 H82 Z M86 171 H96 M86 176 H96 M86 181 H96" fill="none" stroke="#1f8b4c" stroke-width="2"/>
    <text x="125" y="174" class="section green">1. STRUCTURED DATA</text>
    <text x="125" y="195" class="sectionSub">Synthetic finance and procurement input</text>
  </g>
  <g aria-label="Stage two deterministic specification">
    <path d="M598 155 L618 163 V179 C618 191 610 198 598 203 C586 198 578 191 578 179 V163 Z" fill="#eaf2ff" stroke="#2667c9" stroke-width="2"/>
    <path d="M590 178 L596 184 L607 171" fill="none" stroke="#2667c9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="635" y="174" class="section blue">2. DETERMINISTIC SPEC</text>
    <text x="635" y="195" class="sectionSub">Bounded, inspectable, repeatable</text>
  </g>
  <g aria-label="Stage three presentation output">
    <rect x="1100" y="155" width="42" height="42" rx="8" fill="#fff0e6" stroke="#e66a19" stroke-width="2"/>
    <rect x="1109" y="165" width="24" height="16" rx="2" fill="none" stroke="#e66a19" stroke-width="2"/>
    <path d="M1115 187 H1127 M1121 181 V190" stroke="#e66a19" stroke-width="2"/>
    <text x="1155" y="174" class="section orange">3. EXECUTIVE DECK</text>
    <text x="1155" y="195" class="sectionSub">Summary and detail slides</text>
  </g>
  <g aria-label="Synthetic spreadsheet input">
    <rect x="55" y="225" width="470" height="510" rx="18" fill="#ffffff" stroke="#65a97c" stroke-width="2"/>
    <path d="M55 243 Q55 225 73 225 H507 Q525 225 525 243 V270 H55 Z" fill="#1f8b4c"/>
    <circle cx="78" cy="247" r="5" fill="#d8f0df"/>
    <circle cx="97" cy="247" r="5" fill="#d8f0df"/>
    <circle cx="116" cy="247" r="5" fill="#d8f0df"/>
    <text x="78" y="300" class="cardTitle green">SYNTHETIC PERFORMANCE TABLE</text>
    <rect x="78" y="320" width="424" height="212" rx="10" fill="#fbfdff" stroke="#c8d8e8"/>
    <rect x="78" y="320" width="424" height="38" rx="10" fill="#e8f5ed"/>
    <text x="92" y="344" class="label">Category</text>
    <text x="244" y="344" class="label">Current</text>
    <text x="327" y="344" class="label">Target</text>
    <text x="408" y="344" class="label">Status</text>
    <g stroke="#dbe6f0" stroke-width="1">
      <path d="M78 358 H502 M78 397 H502 M78 436 H502 M78 475 H502"/>
      <path d="M225 320 V532 M310 320 V532 M390 320 V532"/>
