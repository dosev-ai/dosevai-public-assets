    <text x="1150" y="376" style="font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:500;fill:#d9e4f2">Synthetic public proof</text>
    <rect x="1120" y="430" width="395" height="122" rx="13" fill="#f8fbff" stroke="#d5e0ec"/>
    <text x="1140" y="458" class="cardTitle">KPI Summary</text>
    <g>
      <rect x="1140" y="474" width="104" height="58" rx="9" fill="#ffffff" stroke="#d5e0ec"/><text x="1192" y="495" text-anchor="middle" class="tiny">On track</text><text x="1192" y="520" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:700;fill:#1f8b4c">2</text>
      <rect x="1256" y="474" width="104" height="58" rx="9" fill="#ffffff" stroke="#d5e0ec"/><text x="1308" y="495" text-anchor="middle" class="tiny">Review</text><text x="1308" y="520" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:700;fill:#e66a19">2</text>
      <rect x="1372" y="474" width="123" height="58" rx="9" fill="#ffffff" stroke="#d5e0ec"/><text x="1433" y="495" text-anchor="middle" class="tiny">Source rows</text><text x="1433" y="520" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:700;fill:#2667c9">4</text>
    </g>
    <rect x="1120" y="572" width="395" height="132" rx="13" fill="#f8fbff" stroke="#d5e0ec"/>
    <text x="1140" y="600" class="cardTitle">Category Detail</text>
    <rect x="1140" y="616" width="355" height="25" rx="5" fill="#fff0e6"/>
    <text x="1151" y="633" class="tiny navy">Category</text><text x="1290" y="633" class="tiny navy">Current</text><text x="1360" y="633" class="tiny navy">Target</text><text x="1432" y="633" class="tiny navy">Status</text>
    <g class="tiny"><text x="1151" y="659">Professional services</text><text x="1302" y="659">92</text><text x="1372" y="659">90</text><text x="1434" y="659" class="green">On track</text><text x="1151" y="684">Software</text><text x="1302" y="684">84</text><text x="1372" y="684">90</text><text x="1434" y="684" class="orange">Review</text></g>
  </g>
  <g aria-label="Artifact lineage">
