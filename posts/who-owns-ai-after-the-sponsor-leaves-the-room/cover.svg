<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What changed the result?</title>
  <desc id="desc">A dark navy executive cover showing four change layers feeding a business operating owner, a controlled assessment path, and three possible business outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#030814"/><stop offset="0.64" stop-color="#08182b"/><stop offset="1" stop-color="#17100b"/></linearGradient>
    <radialGradient id="glow" cx="84%" cy="38%" r="50%"><stop offset="0" stop-color="#ff8a1f" stop-opacity=".20"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#34597a" stroke-width="1" opacity=".16"/></pattern>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#75c9ff"/></marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ff8a1f"/></marker>
    <style>
      .display{font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:.3px}
      .body{font-family:Arial,Helvetica,sans-serif}
      .left-title{font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700;fill:#f6f8fb}
      .left-sub{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#9fc5df}
      .step{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;fill:#f6f8fb}
      .outcome-title{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:800;fill:#f6f8fb}
      .outcome-sub{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#9fc5df}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <text x="84" y="112" class="display" font-size="66" fill="#f6f8fb">WHAT CHANGED THE RESULT?</text>
  <text x="87" y="162" class="body" font-size="29" fill="#9fc5df">Four change layers. One accountable business decision.</text>

  <g transform="translate(76 245)">
    <rect width="350" height="82" rx="18" fill="#0a1b31" stroke="#75c9ff" stroke-width="2"/>
    <circle cx="42" cy="41" r="19" fill="none" stroke="#75c9ff" stroke-width="4"/><path d="M31 41h22M42 30v22" stroke="#75c9ff" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="34" class="left-title">BUSINESS SEMANTICS</text><text x="78" y="59" class="left-sub">Taxonomy • policy • definitions</text>
  </g>
  <g transform="translate(76 350)">
    <rect width="350" height="82" rx="18" fill="#0a1b31" stroke="#75c9ff" stroke-width="2"/>
    <ellipse cx="42" cy="29" rx="20" ry="9" fill="none" stroke="#75c9ff" stroke-width="3"/><path d="M22 29v24c0 6 9 10 20 10s20-4 20-10V29M22 41c0 6 9 10 20 10s20-4 20-10" fill="none" stroke="#75c9ff" stroke-width="3"/>
    <text x="78" y="34" class="left-title">SOURCE DATA</text><text x="78" y="59" class="left-sub">ERP • schema • evidence grain</text>
  </g>
  <g transform="translate(76 455)">
    <rect width="350" height="82" rx="18" fill="#0a1b31" stroke="#ff8a1f" stroke-width="2"/>
    <path d="M25 42h34M42 25v34M29 29l26 26M55 29L29 55" stroke="#ff8a1f" stroke-width="3.2" stroke-linecap="round"/>
    <text x="78" y="34" class="left-title">AI CONFIGURATION</text><text x="78" y="59" class="left-sub">Model • prompt • retrieval</text>
  </g>
  <g transform="translate(76 560)">
    <rect width="350" height="82" rx="18" fill="#0a1b31" stroke="#ff8a1f" stroke-width="2"/>
    <path d="M23 30h38M29 42h26M35 54h14" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="34" class="left-title">OPERATING RULES</text><text x="78" y="59" class="left-sub">Corrections • feedback • thresholds</text>
  </g>

  <path d="M434 286C520 286 504 370 585 390" fill="none" stroke="#75c9ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M434 391C520 391 520 405 585 405" fill="none" stroke="#75c9ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M434 496C520 496 520 440 585 422" fill="none" stroke="#ff8a1f" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M434 601C520 601 504 475 585 438" fill="none" stroke="#ff8a1f" stroke-width="4" marker-end="url(#arrowOrange)"/>

  <g transform="translate(610 295)">
    <rect width="450" height="250" rx="36" fill="#07182a" stroke="#ff8a1f" stroke-width="4"/>
    <circle cx="225" cy="78" r="42" fill="none" stroke="#ff8a1f" stroke-width="6"/>
    <path d="M204 79l14 14 30-36" fill="none" stroke="#ff8a1f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="225" y="155" text-anchor="middle" class="display" font-size="25" fill="#f6f8fb">BUSINESS OPERATING OWNER</text>
    <text x="225" y="194" text-anchor="middle" class="body" font-size="18" fill="#9fc5df">Owns attribution, continuity and release decision</text>
    <text x="225" y="224" text-anchor="middle" class="body" font-size="15" fill="#ffb36b">Not the model. Not the platform. The business result.</text>
  </g>

  <path d="M1080 420H1154" fill="none" stroke="#ff8a1f" stroke-width="5" marker-end="url(#arrowOrange)"/>

  <g transform="translate(1182 250)">
    <rect width="320" height="90" rx="20" fill="#0d2640" stroke="#7be0b4" stroke-width="2.5"/>
    <text x="160" y="39" text-anchor="middle" class="outcome-title">EXPECTED MOVEMENT</text><text x="160" y="66" text-anchor="middle" class="outcome-sub">Approved semantic or source change</text>
  </g>
  <g transform="translate(1182 375)">
    <rect width="320" height="90" rx="20" fill="#24170f" stroke="#ff8a1f" stroke-width="2.5"/>
    <text x="160" y="39" text-anchor="middle" class="outcome-title">APPROVED IMPROVEMENT</text><text x="160" y="66" text-anchor="middle" class="outcome-sub">Better result, explained and accepted</text>
  </g>
  <g transform="translate(1182 500)">
    <rect width="320" height="90" rx="20" fill="#281318" stroke="#ff7d7d" stroke-width="2.5"/>
    <text x="160" y="39" text-anchor="middle" class="outcome-title">UNEXPLAINED VARIANCE</text><text x="160" y="66" text-anchor="middle" class="outcome-sub">Pause, repair or reverse</text>
  </g>

  <g transform="translate(520 675)">
    <line x1="0" y1="0" x2="720" y2="0" stroke="#34597a" stroke-width="4"/>
    <g fill="#75c9ff"><circle cx="0" cy="0" r="10"/><circle cx="180" cy="0" r="10"/><circle cx="360" cy="0" r="10"/></g>
    <g fill="#ff8a1f"><circle cx="540" cy="0" r="10"/><circle cx="720" cy="0" r="10"/></g>
    <text x="0" y="46" text-anchor="middle" class="step">VERSION</text><text x="180" y="46" text-anchor="middle" class="step">MAP</text><text x="360" y="46" text-anchor="middle" class="step">REPLAY</text><text x="540" y="46" text-anchor="middle" class="step">ATTRIBUTE</text><text x="720" y="46" text-anchor="middle" class="step">APPROVE</text>
    <text x="360" y="92" text-anchor="middle" class="body" font-size="17" fill="#9fc5df">A material change becomes a business decision when its effect is explained.</text>
  </g>
</svg>
