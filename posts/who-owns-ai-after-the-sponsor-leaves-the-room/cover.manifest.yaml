title: What changed the result?
alt: >-
  Four sources of change—business semantics, source data, AI configuration and operating rules—flow to a business operating owner, who versions, maps, replays, attributes and approves the change before accepting expected movement, an approved improvement or an unexplained variance.
caption: >-
  A changed result is not automatically model drift. The operating owner separates semantic, data, AI and rule changes before approving the business outcome.
semantic_description: >-
  The cover presents four possible causes of a changed Finance or Procurement result. Business semantics and source data are shown in blue; AI configuration and operating rules are shown in orange. All four feed a named business operating owner. A five-stage control path—Version, Map, Replay, Attribute and Approve—supports a decision among expected movement, approved improvement and unexplained variance. The visual does not imply that the model defines policy, that every change is an error, or that approval is automatic.
claims:
  - A material result can change because of business semantics, source data, AI configuration or operating rules.
  - A named business operating owner should attribute material differences before approving release.
  - A changed result may be expected, an approved improvement or an unexplained variance.
boundaries:
  - The visual does not identify any employer, vendor, ERP, model or proprietary taxonomy.
  - The visual does not claim that every output difference is model drift or an error.
  - The visual does not imply automatic approval, unattended release or deployed enterprise maturity.
